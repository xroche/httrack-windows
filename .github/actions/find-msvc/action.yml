# One lookup for the MSVC and SDK tools several steps need. Written three times before
# this, each hardcoding the x64 host directory, which is wrong the moment a job runs
# anywhere else. Exports through GITHUB_ENV, so later steps in the same job use $env:.
name: Find the MSVC tools
description: Locate vswhere's Visual Studio, its newest toolset, and a host-appropriate dumpbin and mt.

outputs:
  tools:
    description: The MSVC toolset directory, for a step that needs its version or its libraries.
    value: ${{ steps.find.outputs.tools }}

runs:
  using: composite
  steps:
    - id: find
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) { throw "vswhere is not at $vswhere" }
        $vs = & $vswhere -latest -products * -property installationPath
        if (-not $vs) { throw 'vswhere found no Visual Studio installation' }

        # Newest toolset: these are host tools, and dumpbin reads any target. A step that
        # needs the toolset the BUILD selected must read $(PlatformToolset), not this.
        $tools = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory |
                   Sort-Object { [version]$_.Name } | Select-Object -Last 1
        if (-not $tools) { throw "no MSVC toolset under $vs\VC\Tools\MSVC" }

        # State the host preference rather than sorting: descending on the path ranks
        # "x86" above "x64", so a plain sort silently picks the 32-bit host tool.
        $prefer = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64', 'x64', 'x86' }
                  else { 'x64', 'x86' }

        $dumpbin = $null
        foreach ($h in $prefer) {
          $try = Join-Path $tools.FullName "bin\Host$h\$h\dumpbin.exe"
          if (Test-Path $try) { $dumpbin = $try; break }
        }
        if (-not $dumpbin) { throw "no dumpbin for host $($prefer -join '/') under $($tools.FullName)\bin" }

        # The SDK lays these out as bin\<version>\<host>\mt.exe, newest version first.
        $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory -ErrorAction SilentlyContinue |
                 Where-Object Name -match '^10\.' | Sort-Object { [version]$_.Name } -Descending
        $mt = $null
        foreach ($v in $sdk) {
          foreach ($h in $prefer) {
            $try = Join-Path $v.FullName "$h\mt.exe"
            if (Test-Path $try) { $mt = $try; break }
          }
          if ($mt) { break }
        }
        if (-not $mt) { throw "no mt.exe for host $($prefer -join '/') in the Windows SDK" }

        "VSINSTALL=$vs"                 | Out-File -Append $env:GITHUB_ENV
        "MSVC_TOOLS=$($tools.FullName)" | Out-File -Append $env:GITHUB_ENV
        "DUMPBIN=$dumpbin"              | Out-File -Append $env:GITHUB_ENV
        "MT=$mt"                        | Out-File -Append $env:GITHUB_ENV
        "tools=$($tools.FullName)"      | Out-File -Append $env:GITHUB_OUTPUT
        Write-Host "toolset $($tools.Name); dumpbin $dumpbin; mt $mt"
