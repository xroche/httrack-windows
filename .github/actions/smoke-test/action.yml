# Install the installer, run the thing, uninstall it. Until this existed nothing had
# ever executed: the manifest bug that stopped the exe from starting got through a
# fully green build, because a compiler cannot tell you whether Windows will load the
# binary. Shared so that the signing run tests the installer it is about to publish
# exactly as the build run tests the unsigned one.
name: Smoke-test the installer
description: Install WinHTTrack silently, run the GUI and the CLI, then uninstall.

inputs:
  setup:
    description: The installer to test.
    required: true
  version:
    description: The version WinHTTrack.exe and the installer must report.
    required: true
  engine-version:
    description: The version httrack.exe must report, which trails the GUI's.
    required: true
  thumbprint:
    description: When set, every signature must be valid, timestamped, and this certificate's.
    default: ''
  require-signature:
    description: "'true' to demand a thumbprint: signing must never be skipped just because one was not passed."
    default: 'false'
  check-crash-report:
    description: "'false' to skip the crash-report check entirely."
    default: 'true'
  vendored-list:
    description: runtime-vendored.txt from the payload, naming the DLLs that stay signed by Microsoft.
    default: ''
  install-dir:
    description: Where to install.
    default: C:\WinHTTrackTest

runs:
  using: composite
  steps:
    - shell: pwsh
      env:
        SETUP: ${{ inputs.setup }}
        APPVER: ${{ inputs.version }}
        ENGINEVER: ${{ inputs.engine-version }}
        THUMBPRINT: ${{ inputs.thumbprint }}
        REQUIRE_SIG: ${{ inputs.require-signature }}
        CHECK_CRASH: ${{ inputs.check-crash-report }}
        INSTALL_DIR: ${{ inputs.install-dir }}
        VENDORED_LIST: ${{ inputs.vendored-list }}
      run: |
        $setup = Get-Item $env:SETUP
        $dir = $env:INSTALL_DIR
        # Without this, an empty version would make [regex]::Escape('') = '' and
        # `-notmatch ''` false: every version assertion below would stop asserting.
        if ([string]::IsNullOrWhiteSpace($env:APPVER)) { throw 'no version was passed: the version checks would be vacuous' }
        if ([string]::IsNullOrWhiteSpace($env:ENGINEVER)) { throw 'no engine version was passed: the CLI version check would be vacuous' }
        # Skipping the signature checks is the normal shape on every unsigned build,
        # so the release path has to say out loud that it expects them.
        if ($env:REQUIRE_SIG -eq 'true' -and -not $env:THUMBPRINT) { throw 'signatures were required but no thumbprint was passed' }
        if ($env:THUMBPRINT -and $env:THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') { throw "'$env:THUMBPRINT' is not a 40-hex thumbprint" }

        # A catalog-signed file reports Microsoft as its signer whatever is embedded in
        # it, so the thumbprint is the only assertion that cannot pass by accident.
        function Test-Signature($path) {
          $name = Split-Path $path -Leaf
          $sig = Get-AuthenticodeSignature $path
          if ($sig.Status -ne 'Valid') { return "$name is $($sig.Status), not Valid" }
          if ($sig.SignerCertificate.Thumbprint -ne $env:THUMBPRINT) {
            return "$name is signed by $($sig.SignerCertificate.Thumbprint), not $env:THUMBPRINT"
          }
          # A missing countersignature stays invisible until the certificate expires and
          # every installer ever downloaded goes bad at once.
          if (-not $sig.TimeStamperCertificate) { return "$name carries no RFC 3161 timestamp" }
          Write-Host "  $name signed by $($sig.SignerCertificate.Subject), timestamped by $($sig.TimeStamperCertificate.Subject)"
          return $null
        }

        if ($env:THUMBPRINT) {
          $bad = Test-Signature $setup.FullName
          if ($bad) { throw $bad }
        }

        function Get-UninstallEntries {
          $roots = @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
                     'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall',
                     'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall')
          return @(foreach ($r in $roots) {
            if (Test-Path $r) {
              foreach ($k in Get-ChildItem $r) {
                # -LiteralPath: a key name containing [ ] would otherwise read as a wildcard and be skipped.
                $dn = (Get-ItemProperty -LiteralPath $k.PSPath -ErrorAction SilentlyContinue).DisplayName
                if ($dn -like 'WinHTTrack*') { "$r\$($k.PSChildName) = $dn" }
              }
            }
          })
        }
        # The sign job runs both arches on one runner, so start by proving nothing is left
        # over: otherwise a key orphaned by the previous leg fails THIS one and blames it.
        $before = Get-UninstallEntries
        if ($before.Count -ne 0) { throw "$($before.Count) WinHTTrack uninstall entry already present before installing" }

        $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList `
          '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir","/LOG=$PWD\install.log"
        if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }

        $exe = "$dir\WinHTTrack.exe"
        if (-not (Test-Path $exe)) { throw "installer did not place WinHTTrack.exe" }

        # Everything laid down, including the uninstaller Inno generates and the OpenSSL
        # and zlib DLLs. Signing them is worth nothing if packaging then loses it.
        if ($env:THUMBPRINT) {
          $pes = @(Get-ChildItem $dir -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' })
          Write-Host "--- signatures on the $($pes.Count) installed binaries ---"
          if ($pes.Count -lt 5) { throw "only $($pes.Count) binaries were installed: the check below would prove nothing" }
          # The app-local runtime stays signed by Microsoft, so check it against them. By
          # name from the manifest: the file cannot say whether it was wrongly re-signed.
          $vendored = @{}
          if ($env:VENDORED_LIST) {
            if (-not (Test-Path $env:VENDORED_LIST)) { throw "no vendored list at $env:VENDORED_LIST" }
            Get-Content $env:VENDORED_LIST | Where-Object { $_.Trim() } | ForEach-Object { $vendored[$_.Trim()] = $true }
          }
          foreach ($n in 'WinHTTrack.exe', 'httrack.exe', 'libhttrack.dll') {
            if ($vendored.ContainsKey($n)) { throw "$n is listed as vendored: the manifest is wrong" }
          }
          $bad = @()
          foreach ($f in $pes) {
            if (-not $vendored.ContainsKey($f.Name)) { $bad += Test-Signature $f.FullName; continue }
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              $bad += "$($f.Name) is vendored but carries no valid Microsoft signature ($($sig.Status))"
            }
          }
          $bad = @($bad | Where-Object { $_ })
          if ($bad) { throw ($bad -join "`n") }
        }

        # THE test. A non-zero exit here means the binary does not start: a bad
        # manifest, a DLL that will not resolve, a broken install. All of which
        # a green compile happily allows.
        $p = Start-Process $exe -ArgumentList '--version' -Wait -PassThru `
               -RedirectStandardOutput "$PWD\version.txt"
        $out = (Get-Content "$PWD\version.txt" -Raw).Trim()
        Write-Host "WinHTTrack.exe --version -> exit=$($p.ExitCode), output='$out'"
        if ($p.ExitCode -ne 0) { throw "WinHTTrack.exe --version exited $($p.ExitCode): it does not start" }
        if ($out -notmatch [regex]::Escape($env:APPVER)) { throw "expected version $env:APPVER, got '$out'" }
        # --check-signature, and then the same question with one byte changed. A checker
        # that answers "verified" whatever it is given passes every other assertion here,
        # so the flipped copy is the one that proves something. Run on unsigned builds
        # too: the app-local runtime is signed by Microsoft whoever signed the rest.
        $p = Start-Process $exe -ArgumentList '--check-signature' -Wait -PassThru `
               -RedirectStandardOutput "$PWD\sig.txt"
        $sig = (Get-Content "$PWD\sig.txt" -Raw).Trim()
        Write-Host "WinHTTrack.exe --check-signature ->"
        Write-Host $sig
        if ($p.ExitCode -ne 0) { throw "--check-signature exited $($p.ExitCode)" }
        foreach ($n in 'WinHTTrack.exe', 'libhttrack.dll') {
          if ($sig -notmatch [regex]::Escape($n)) { throw "--check-signature never looked at $n" }
        }
        foreach ($line in ($sig -split "\r?\n")) {
          if (-not $line.Trim()) { continue }
          if ($env:THUMBPRINT) {
            if ($line -notmatch 'verified') { throw "this build was signed, yet: $line" }
          } elseif ($line -match 'verified') {
            throw "nothing was signed, yet: $line"
          }
        }
        # The biggest one, and a byte near its front. Halfway into a small PE lands inside
        # the certificate blob, which breaks the certificate rather than the image and
        # answers a different question (0x80096004, not the 0x80096010 we are asking for).
        $signed = Get-ChildItem $dir -File -Filter '*.dll' |
                    Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -eq 'Valid' -and $_.Length -gt 65536 } |
                    Sort-Object Length -Descending | Select-Object -First 1
        if (-not $signed) { throw 'no signed DLL over 64 KB was installed: the probe below would prove nothing' }
        $tampered = Join-Path $PWD 'tampered.bin'
        Copy-Item $signed.FullName $tampered
        $bytes = [System.IO.File]::ReadAllBytes($tampered)
        $at = 0x1000
        $bytes[$at] = $bytes[$at] -bxor 0xFF
        [System.IO.File]::WriteAllBytes($tampered, $bytes)
        Start-Process $exe -ArgumentList '--check-signature', $signed.FullName -Wait `
               -RedirectStandardOutput "$PWD\sig-intact.txt"
        Start-Process $exe -ArgumentList '--check-signature', $tampered -Wait `
               -RedirectStandardOutput "$PWD\sig-broken.txt"
        $intact = (Get-Content "$PWD\sig-intact.txt" -Raw).Trim()
        $broken = (Get-Content "$PWD\sig-broken.txt" -Raw).Trim()
        Write-Host "  intact:   $intact"
        Write-Host "  tampered: $broken"
        if ($intact -match 'unsigned|unverifiable') { throw "the control file reads as unsigned: $intact" }
        if ($broken -notmatch 'MODIFIED') { throw "one byte was flipped and the verdict did not follow: $broken" }
        # --version only proves the binary LOADS: it exits before any data file is
        # touched. That is exactly why a missing lang.def shipped. --selftest runs
        # the real startup, through LANG_INIT, and exits before showing a window.
        $report = Join-Path $env:TEMP 'WinHTTrack-exception.txt'
        # -Force, then prove it: the report is opened for APPEND, so a leftover would be
        # asserted against instead of this run.
        Remove-Item $report -Force -ErrorAction SilentlyContinue
        if (Test-Path $report) { throw "$report survived deletion" }
        $p = Start-Process $exe -ArgumentList '--selftest' -Wait -PassThru `
               -RedirectStandardOutput "$PWD\selftest.txt" -RedirectStandardError "$PWD\selftest.err"
        $so = (Get-Content "$PWD\selftest.txt" -Raw -ErrorAction SilentlyContinue)
        $se = (Get-Content "$PWD\selftest.err" -Raw -ErrorAction SilentlyContinue)
        Write-Host "WinHTTrack.exe --selftest -> exit=$($p.ExitCode)"
        if ($so) { Write-Host "  stdout: $($so.Trim())" }
        if ($se) { Write-Host "  stderr: $($se.Trim())" }
        if ($p.ExitCode -ne 0) { throw "WinHTTrack.exe --selftest exited $($p.ExitCode): the installation is incomplete" }
        if ("$so" -notmatch 'startup ok') { throw "selftest did not report startup ok" }
        # The counts below are exact, not lower bounds: adding a case must move the number
        # here too, since a deleted one otherwise hides behind a still-positive total.
        # The installer never writes WinHTTrack.ini, so this leg is the control for the
        # staged tree's portable run: a constant mode fails one of the two.
        if ("$so" -notmatch 'settings store ok on 2 checks \(registry, associates\)') {
          throw "an installed copy did not keep its settings in the registry"
        }
        # The MBCS->UTF-8 conversion the engine depends on is only reachable by typing into
        # a dialog. --selftest exercises it; assert it actually RAN, or the check silently
        # skips (its ANSI-codepage guard) and proves nothing.
        if ("$so" -notmatch 'MBCS->UTF-8 ok on 2 checks') {
          throw "selftest did not exercise the MBCS->UTF-8 conversion"
        }
        # The suffix proves the best-fit case can fail: cp1252 offers a lookalike for U+0100.
        # Where a codepage offers none, that case cannot catch anything. The last two checks
        # run only there, so the count and the suffix move together.
        if ("$so" -notmatch 'catalog decoding ok on 6 checks \(best-fit acp\)') {
          throw 'selftest did not report catalog decoding: a legacy catalog may be silently mangled'
        }
        # Swapping decode and unescape is invisible on this cp1252 runner, so this drives CP932.
        # The first assertion is the control that the hazard fires at all.
        if ("$so" -notmatch 'unescaping order ok on 7 checks(?! \(utf-8)') {
          throw 'selftest did not prove the catalog is decoded before it is unescaped'
        }
        # Every help button hands one of these to the browser: an unescaped space truncates
        # the path, an unescaped '#' names a file, since NTFS allows one in a filename.
        if ("$so" -notmatch 'help URLs ok on 5 checks') {
          throw "selftest did not check the help URLs"
        }
        # Guards the empty-name terminator (newlang.h); losing it hangs the first-run About
        # box. The only count left loose: it is the size of the engine's lang.def, so pinning
        # it would turn an engine translation into a red build here.
        if ("$so" -notmatch 'language list ends after [1-9]\d* entries') {
          throw "selftest did not check that the language list terminates"
        }
        # lang.indexes counts from LANGUAGE_1 and our indices from 0: an unchecked
        # off-by-one would seed the first run in the neighbouring language.
        if ("$so" -notmatch 'lang\.indexes offset checked on 4 locales and 9 checks') {
          throw "selftest did not check the lang.indexes offset"
        }
        # Pinned: an unasserted line can stop running, and this one guards what the update URL sends.
        if ("$so" -notmatch 'update-url language ok on 3 locales and 12 checks') {
          throw "selftest did not check what the update URL sends as the language"
        }
        # Locale count is not pinned: it tracks the engine's catalogs, which we do not own.
        if ("$so" -notmatch 'update-url basename unique and ASCII on [1-9]\d* locales') {
          throw "selftest did not sweep every catalog for a backfilled or non-ASCII basename"
        }
        # The option caps count UTF-8 bytes, so the accented value is the case that matters;
        # it carries an ANSI-codepage guard and names itself when it skips.
        if ("$so" -notmatch 'quoted arguments ok on 15 checks(?! \(accented)') {
          throw "selftest did not check the quoted arguments against an accented value"
        }
        # A footer preset is only reachable by opening the Browser ID page. The field count
        # is loose: they come from the engine's default footer, not from our table.
        if ("$so" -notmatch 'footer presets ok on 16 checks and [1-9]\d* fields') {
          throw "selftest did not check the footer presets"
        }
        # A rule the splitter mangles reaches the engine as --host-alias "" and aborts the mirror.
        if ("$so" -notmatch 'rule splitting ok on 12 checks') {
          throw "selftest did not check the Experts rule splitter"
        }
        # winprofile.ini is a cross-front-end contract: WebHTTrack and Android read what we write.
        if ("$so" -notmatch 'profile escaping ok on 8 decodes, 4 round trips and 2 terminators') {
          throw "selftest did not check the winprofile.ini escaping"
        }
        # Pins the checkbox-gating contract (see WinHTTrack/Shell.h).
        if ("$so" -notmatch 'option gating ok on 16 checks') {
          throw "selftest did not check the checkbox gating"
        }
        # The entry count is the .rc's and the catalog's, so it is pinned alongside the rows.
        if ("$so" -notmatch 'build structure ok on 26 checks and 15 combo entries(?! \(accented)') {
          throw "selftest did not check the Build tab's naming structure"
        }
        # A cap the engine refuses aborts the mirror, so the shell must never build one.
        if ("$so" -notmatch 'single-file caps ok on 7 checks') {
          throw "selftest did not check the single-file cap"
        }
        # The grammar lives in the engine, so a change there has to land here, not in a mirror.
        if ("$so" -notmatch 'host-alias rules ok on 34 checks') {
          throw "selftest did not check the host-alias grammar"
        }
        # A wrong wizard answer quietly applies the wrong filter rather than failing.
        if ("$so" -notmatch 'wizard answers ok on 22 checks') {
          throw "selftest did not check the wizard answers"
        }
        # The answer indexes this menu, so it must stay the engine's list in the engine's order.
        if ("$so" -notmatch 'wizard scopes ok on 2 checks') {
          throw "selftest did not check the wizard host scopes"
        }
        # A crash report names the build that crashed; nothing else in CI reads that header.
        if ("$so" -notmatch 'crash report header ok on 3 checks') {
          throw "selftest did not check the crash report header"
        }

        # The New Folder dialog cannot be opened from here, so its length rules are pinned instead.
        if ("$so" -notmatch 'folder names ok on 7 checks') {
          throw "selftest did not check the New Folder name lengths"
        }

        # No CI can log off, so this count is the only proof the session-end stop ran.
        if ("$so" -notmatch 'session end ok on 8 checks') {
          throw "selftest did not check the session-end stop"
        }
        # No mirror runs under --selftest, so this count is the only proof the verdict maps right.
        if ("$so" -notmatch 'end-of-mirror verdict ok on 21 checks') {
          throw "selftest did not check the end-of-mirror verdict"
        }
        # Only the wait itself: no mirror runs here, so lance() calling it is not covered.
        if ("$so" -notmatch 'engine results wait ok on 16 checks') {
          throw "selftest did not check the wait on the engine's results"
        }

        # --selftest throws once on purpose. Without shipped PDBs this only proves the hook
        # ran and caught the throw stack; the build job checks resolution against staged.
        # Skipped on the signing run: symbols do not resolve there and this must not gate a release.
        $trace = if (Test-Path $report) { Get-Content $report -Raw } else { '' }
        Write-Host "--- crash report ---`n$trace"
        if ($env:CHECK_CRASH -ne 'false') {
          if (-not $trace) { throw "no crash report written: the first-chance hook never ran" }
          if ($trace -notmatch 'throw site') { throw "report holds the handler stack, not the throw stack" }
        }

        # The CLI is a separate binary against the same DLL: it can be broken while the
        # GUI is fine. -#h prints the version -- the engine's, which stamps it -- and exits 0.
        $cli = Join-Path $dir 'httrack.exe'
        if (-not (Test-Path $cli)) { throw "the installer did not lay down httrack.exe" }
        $p = Start-Process $cli -ArgumentList '-#h' -Wait -PassThru `
               -RedirectStandardOutput "$PWD\cli.txt" -RedirectStandardError "$PWD\cli.err"
        $co = (Get-Content "$PWD\cli.txt" -Raw -ErrorAction SilentlyContinue)
        $co1 = ("$co".Trim() -split "\r?\n" | Select-Object -First 1)
        Write-Host "httrack.exe -#h -> exit=$($p.ExitCode), output='$co1'"
        if ($p.ExitCode -ne 0) { throw "httrack.exe -#h exited $($p.ExitCode)" }
        if ($co -notmatch [regex]::Escape($env:ENGINEVER)) {
          throw "httrack.exe reported no version, or the wrong one: expected $env:ENGINEVER"
        }

        Write-Host "::notice::WinHTTrack $env:APPVER (engine $env:ENGINEVER) installs, starts and runs ($($setup.Name))."

        # Every run so far got a clean machine, so an upgrade that laid a second installation
        # beside the first would never have shown up. Re-running this installer takes the path
        # an upgrade takes: the encoding job asserts the premise, that the installer identity
        # carries no version, so this cannot quietly stop standing in for one.
        $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList `
          '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir","/LOG=$PWD\reinstall.log"
        if ($p.ExitCode -ne 0) { throw "installing over the existing copy exited $($p.ExitCode)" }
        if (-not (Test-Path $exe)) { throw "installing over the existing copy removed WinHTTrack.exe" }
        $vo = "$PWD\overversion.txt"
        $p = Start-Process $exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $vo
        if ($p.ExitCode -ne 0) { throw "WinHTTrack.exe exited $($p.ExitCode) after installing over" }
        if ((Get-Content $vo -Raw) -notmatch [regex]::Escape($env:APPVER)) {
          throw "after installing over, WinHTTrack.exe does not report $env:APPVER"
        }

        # Two entries in Add/Remove Programs is the failure, and exit 0 cannot see it.
        # x86 installs land under WOW6432Node, x64 under the native view. The hive is the
        # control for the per-user leg below, since with no /CURRENTUSER this stays machine-wide.
        $entries = @(Get-UninstallEntries)
        foreach ($e in $entries) { Write-Host "  uninstall entry: $e" }
        if ($entries.Count -ne 1) {
          throw "expected 1 uninstall entry after installing over, found $($entries.Count)"
        }
        if ($entries[0] -notlike 'HKLM:*') { throw "the default install went per-user: $($entries[0])" }
        Write-Host "::notice::installing $env:APPVER over itself upgrades in place, one uninstall entry"

        # The machine-wide copy is still here, so a Store /CURRENTUSER install must decline
        # rather than lay a second one beside it. The per-user leg below is the control.
        # No /DIR is passed to a per-user install, so this path comes from {autopf}.
        $userDir = Join-Path $env:LOCALAPPDATA 'Programs\WinHTTrack'
        $userExe = Join-Path $userDir 'WinHTTrack.exe'
        # Every decline is waited on with a timeout, because a message box would hang the leg.
        $p = Start-Process $setup.FullName -PassThru -ArgumentList `
          '/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$PWD\declined.log"
        if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "declining hung, and /SUPPRESSMSGBOXES was passed" }
        # 1638 is what InnoSetup/httrack.iss returns for this.
        if ($p.ExitCode -ne 1638) { throw "a per-user install beside the machine-wide copy exited $($p.ExitCode), expected 1638" }
        if (Test-Path $userExe) { throw "the declined install wrote $userExe anyway" }
        if (-not (Test-Path $exe)) { throw "the declined install removed the machine-wide copy" }
        $entries = @(Get-UninstallEntries)
        foreach ($e in $entries) { Write-Host "  uninstall entry: $e" }
        if ($entries.Count -ne 1) { throw "the declined install left $($entries.Count) uninstall entries, expected the 1 already there" }
        # A silent run must draw no box even when the caller did not ask for that.
        $p = Start-Process $setup.FullName -PassThru -ArgumentList `
          '/CURRENTUSER','/VERYSILENT','/NORESTART',"/LOG=$PWD\declined-nosuppress.log"
        if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "declining drew a message box without /SUPPRESSMSGBOXES" }
        if ($p.ExitCode -ne 1638) { throw "declining without /SUPPRESSMSGBOXES exited $($p.ExitCode), expected 1638" }
        Write-Host "::notice::/CURRENTUSER declines with 1638 while a machine-wide copy is installed"

        $unins = Get-ChildItem "$dir\unins*.exe" | Select-Object -First 1
        $p = Start-Process $unins.FullName -Wait -PassThru -ArgumentList '/VERYSILENT','/NORESTART'
        if ($p.ExitCode -ne 0) { throw "uninstaller exited $($p.ExitCode)" }
        Start-Sleep -Seconds 3
        if (Test-Path $exe) { throw "uninstall left WinHTTrack.exe behind" }
        # One of the places the counter above is seen reading something other than 1, so a
        # counter stuck at 1 cannot satisfy every check in this file.
        $left = Get-UninstallEntries
        foreach ($e in $left) { Write-Host "  orphaned entry: $e" }
        if ($left.Count -ne 0) { throw "uninstall left $($left.Count) entry in Add/Remove Programs" }

        # The Microsoft Store passes /CURRENTUSER, and a standard user has no HKLM and
        # no Program Files to write. Every constant below is from InnoSetup/httrack.iss.
        $userExtKey = 'HKCU:\SOFTWARE\Classes\.whtt'
        # The open verb, which MFC cannot create for a standard user. See the .iss comment.
        $userVerb = 'HKCU:\SOFTWARE\Classes\WinHTTrackProject\shell\open\command'
        # Written by a machine-wide install too, into this same user's hive.
        $shared = @('HKCU:\AppEvents\Schemes\Apps\WinHTTrack', 'HKCU:\AppEvents\EventLabels\MirrorFinished')
        $settings = 'HKCU:\SOFTWARE\WinHTTrack Website Copier\WinHTTrack Website Copier\Interface'
        # Which of the four an uninstall left: all of them while another copy needs them, none
        # once the last copy goes. Naming what survived beats a bare count in the failure.
        function Get-SharedState {
          $k = Get-ItemProperty -LiteralPath $settings -ErrorAction SilentlyContinue
          return @(
            foreach ($v in 'SetupRun', 'SetupHasRegistered') { if ($null -ne $k.$v) { $v } }
            foreach ($q in $shared) { if (Test-Path -LiteralPath $q) { $q } }
          )
        }
        $userIcons = @((Join-Path ([Environment]::GetFolderPath('Programs')) 'WinHTTrack\WinHTTrack Website Copier.lnk'),
                       (Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'HTTrack Website Copier.lnk'))
        $machinePaths = @("$env:ProgramFiles\WinHTTrack", "${env:ProgramFiles(x86)}\WinHTTrack",
                          'HKLM:\SOFTWARE\WinHTTrack Website Copier',
                          'HKLM:\SOFTWARE\WOW6432Node\WinHTTrack Website Copier',
                          'HKLM:\SOFTWARE\Classes\.whtt',
                          'HKLM:\SOFTWARE\Classes\WinHTTrackProject',
                          (Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'WinHTTrack\WinHTTrack Website Copier.lnk'),
                          (Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'HTTrack Website Copier.lnk'))
        # Every assertion below is that something is absent, which proves nothing unless it
        # is absent now. The machine-wide uninstall above cleared what it wrote; the rest a
        # machine-wide install never writes, since HKA is HKLM there and {group} is shared.
        # Files rather than their directories, because Inno drops $userDir after it exits.
        foreach ($q in (@($userExe, $userExtKey, $userVerb) + $shared + $userIcons + $machinePaths)) {
          if (Test-Path -LiteralPath $q) { throw "$q is still there: the per-user checks below would be vacuous" }
        }
        # The uninstall above had no other copy to spare, so this is where the deleting half is seen.
        $held = @(Get-SharedState)
        if ($held.Count -ne 0) { throw "the machine-wide uninstall left $($held -join ', ')" }
        $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList `
          '/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$PWD\peruser.log"
        if ($p.ExitCode -ne 0) { throw "the per-user installer exited $($p.ExitCode)" }
        if (-not (Test-Path $userExe)) { throw "a per-user install did not land in $userDir" }
        foreach ($q in $machinePaths) {
          if (Test-Path -LiteralPath $q) { throw "a per-user install wrote $q, which needs administrator" }
        }
        # {group} and {autodesktop} had to resolve into this user's own profile.
        foreach ($q in $userIcons) {
          if (-not (Test-Path -LiteralPath $q)) { throw "a per-user install placed no shortcut at $q" }
        }
        foreach ($q in (@($userExtKey, $userVerb) + $shared)) {
          if (-not (Test-Path -LiteralPath $q)) { throw "a per-user install registered no $q" }
        }
        $entries = @(Get-UninstallEntries)
        foreach ($e in $entries) { Write-Host "  per-user uninstall entry: $e" }
        if ($entries.Count -ne 1) { throw "expected 1 per-user uninstall entry, found $($entries.Count)" }
        if ($entries[0] -notlike 'HKCU:*') { throw "/CURRENTUSER still registered machine-wide: $($entries[0])" }
        $pv = "$PWD\peruser-version.txt"
        $p = Start-Process $userExe -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $pv
        if ($p.ExitCode -ne 0) { throw "the per-user WinHTTrack.exe exited $($p.ExitCode)" }
        if ((Get-Content $pv -Raw) -notmatch [regex]::Escape($env:APPVER)) {
          throw "the per-user copy does not report $env:APPVER"
        }
        # Both copies installed is the state that strands a Store user, and the only one that
        # reaches the per-user clause of the guard.
        $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList `
          '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir","/LOG=$PWD\machine-beside.log"
        if ($p.ExitCode -ne 0) { throw "a machine-wide install beside the per-user copy exited $($p.ExitCode)" }
        # Both entries, or /CURRENTUSER stopped taking effect and the run below proves nothing.
        $entries = @(Get-UninstallEntries)
        if ($entries.Count -ne 2) { throw "expected the HKLM and HKCU entries, found: $($entries -join '; ')" }
        # The Store delivers every update this way, so it must upgrade the per-user copy.
        $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList `
          '/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$PWD\peruser-both.log"
        if ($p.ExitCode -ne 0) { throw "the Store update path exited $($p.ExitCode) with both copies installed" }
        if (-not (Test-Path $userExe)) { throw "the per-user upgrade removed $userExe" }
        # Removed per-user first, the only direction that asks whether a machine-wide copy is there.
        $unins = Get-ChildItem "$userDir\unins*.exe" | Select-Object -First 1
        $p = Start-Process $unins.FullName -Wait -PassThru -ArgumentList '/VERYSILENT','/NORESTART'
        if ($p.ExitCode -ne 0) { throw "the per-user uninstaller beside the machine-wide copy exited $($p.ExitCode)" }
        Start-Sleep -Seconds 3
        # That exit code is the launcher's, not the uninstall's, and every other block here
        # proves the work happened by checking something is gone. This one must too, or
        # "all four survived" also reads true from an uninstall that has not run yet.
        if (Test-Path $userExe) { throw "the per-user uninstall beside the machine-wide copy did not finish" }
        $entries = @(Get-UninstallEntries)
        if ($entries.Count -ne 1 -or $entries[0] -notlike 'HKLM:*') { throw "expected the machine-wide entry alone, found: $($entries -join '; ')" }
        $held = @(Get-SharedState)
        if ($held.Count -ne 4) { throw "the per-user uninstall took what the machine-wide copy needs, leaving $($held -join ', ')" }
        # Put the per-user copy back for the other direction. The machine-wide copy has to go
        # first, because InitializeSetup declines a per-user install beside one.
        $unins = Get-ChildItem "$dir\unins*.exe" | Select-Object -First 1
        $p = Start-Process $unins.FullName -Wait -PassThru -ArgumentList '/VERYSILENT','/NORESTART'
        if ($p.ExitCode -ne 0) { throw "removing the machine-wide copy exited $($p.ExitCode)" }
        Start-Sleep -Seconds 3
        $held = @(Get-SharedState)
        if ($held.Count -ne 0) { throw "with no copy left installed, the uninstall kept $($held -join ', ')" }
        $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList `
          '/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$PWD\peruser-again.log"
        if ($p.ExitCode -ne 0) { throw "reinstalling the per-user copy exited $($p.ExitCode)" }
        $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList `
          '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir","/LOG=$PWD\machine-again.log"
        if ($p.ExitCode -ne 0) { throw "reinstalling the machine-wide copy exited $($p.ExitCode)" }
        # Now the machine-wide copy goes while the per-user one stands.
        $unins = Get-ChildItem "$dir\unins*.exe" | Select-Object -First 1
        $p = Start-Process $unins.FullName -Wait -PassThru -ArgumentList '/VERYSILENT','/NORESTART'
        if ($p.ExitCode -ne 0) { throw "removing the machine-wide copy beside the per-user one exited $($p.ExitCode)" }
        Start-Sleep -Seconds 3
        # The next architecture leg on this runner would otherwise fail blaming the per-user setup.
        foreach ($q in $machinePaths) {
          if (Test-Path -LiteralPath $q) { throw "$q survived the machine-wide uninstall" }
        }
        $entries = @(Get-UninstallEntries)
        if ($entries.Count -ne 1 -or $entries[0] -notlike 'HKCU:*') { throw "the machine-wide uninstall left: $($entries -join '; ')" }
        # The per-user copy is still installed and still needs the HKCU state both installs write.
        $held = @(Get-SharedState)
        if ($held.Count -ne 4) { throw "the machine-wide uninstall took what the per-user copy needs, leaving $($held -join ', ')" }
        Write-Host "::notice::uninstalling one copy leaves the other's settings, and the update path still upgrades it"

        # Two installs share this key, so an uninstall that took it whole would wipe the
        # other copy's options, language and proxy.
        if (-not (Test-Path -LiteralPath $settings)) { throw "the installer wrote no $settings" }
        New-ItemProperty -LiteralPath $settings -Name 'SmokeTestUserSetting' -Value 42 `
          -PropertyType DWord -Force | Out-Null
        $unins = Get-ChildItem "$userDir\unins*.exe" | Select-Object -First 1
        $p = Start-Process $unins.FullName -Wait -PassThru -ArgumentList '/VERYSILENT','/NORESTART'
        if ($p.ExitCode -ne 0) { throw "the per-user uninstaller exited $($p.ExitCode)" }
        Start-Sleep -Seconds 3
        if (Test-Path $userExe) { throw "the per-user uninstall left WinHTTrack.exe behind" }
        foreach ($q in (@($userExtKey, $userVerb) + $shared + $userIcons)) {
          if (Test-Path -LiteralPath $q) { throw "the per-user uninstall left $q behind" }
        }
        $left = Get-UninstallEntries
        foreach ($e in $left) { Write-Host "  orphaned entry: $e" }
        if ($left.Count -ne 0) { throw "the per-user uninstall left $($left.Count) entry in Add/Remove Programs" }
        # SetupRun proves the uninstaller reached this key, so the value that survived is
        # not simply one it never looked at.
        $after = Get-ItemProperty -LiteralPath $settings -ErrorAction SilentlyContinue
        if ($null -eq $after) { throw "the uninstall deleted $settings, taking the user's settings" }
        if ($after.SmokeTestUserSetting -ne 42) { throw "the uninstall took a user setting with it" }
        if ($null -ne $after.SetupRun) { throw "the uninstall left SetupRun behind" }
        if ($null -ne $after.SetupHasRegistered) { throw "the uninstall left SetupHasRegistered behind" }
        Write-Host "  settings key kept the user's value and lost both the installer's"

        # Everything above ran with the runner's elevated token, so none of it can say whether
        # setup.exe finishes without asking for elevation, which is what the Store checks. The
        # same assertions run again here, under the standard-user token linked to this one.
        . "$env:GITHUB_ACTION_PATH\unelevated-token.ps1"
        # A premise, not a skip: with an unelevated runner every install above is already a
        # standard-user run, and this leg has to be rewritten rather than quietly pass.
        if (-not [Unelevated]::IsElevated()) { throw 'the runner is not elevated, so this leg tests nothing new' }
        # Prove the token mechanism itself before the installer rides on it, so a failure here
        # names the API rather than blaming setup.exe.
        $probe = [Unelevated]::Run('cmd.exe /c exit 7', $PWD.Path, 60000)
        if ($probe -ne 7) { throw "the standard-user token ran cmd.exe and got $probe, not 7" }
        $code = [Unelevated]::Run("`"$($setup.FullName)`" /CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /NORESTART `"/LOG=$PWD\unelevated.log`"", $PWD.Path, 300000)
        if ($code -ne 0) { throw "a standard-user install exited $code" }
        if (-not (Test-Path $userExe)) { throw "a standard-user install placed no $userExe" }
        foreach ($q in (@($userExtKey, $userVerb) + $shared + $userIcons)) {
          if (-not (Test-Path -LiteralPath $q)) { throw "a standard-user install registered no $q" }
        }
        foreach ($q in $machinePaths) {
          if (Test-Path -LiteralPath $q) { throw "a standard-user install wrote $q, which needs administrator" }
        }
        $entries = @(Get-UninstallEntries)
        if ($entries.Count -ne 1 -or $entries[0] -notlike 'HKCU:*') { throw "a standard-user install registered: $($entries -join '; ')" }
        # The uninstaller has to manage without elevation too, or Add/Remove Programs strands it.
        $unins = Get-ChildItem "$userDir\unins*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $unins) { throw 'a standard-user install left no uninstaller' }
        $code = [Unelevated]::Run("`"$($unins.FullName)`" /VERYSILENT /NORESTART", $PWD.Path, 300000)
        if ($code -ne 0) { throw "a standard-user uninstall exited $code" }
        # unins000.exe hands off to a copy of itself, so that code is the launcher's. Wait on
        # the uninstall entry, which goes last: the files are gone well before the registry is.
        $deadline = (Get-Date).AddSeconds(60)
        while (@(Get-UninstallEntries).Count -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
        if (Test-Path $userExe) { throw "a standard-user uninstall left $userExe behind" }
        foreach ($q in (@($userExtKey, $userVerb) + $shared + $userIcons)) {
          if (Test-Path -LiteralPath $q) { throw "a standard-user uninstall left $q behind" }
        }
        $left = @(Get-UninstallEntries)
        if ($left.Count -ne 0) { throw "a standard-user uninstall left $($left.Count) entry in Add/Remove Programs" }
        Write-Host "::notice::setup.exe installs and uninstalls with a standard-user token, no elevation asked"

        # The next architecture leg on this runner must not inherit any of it.
        Remove-Item -LiteralPath 'HKCU:\SOFTWARE\WinHTTrack Website Copier' -Recurse -Force -ErrorAction SilentlyContinue
        Write-Host "::notice::/CURRENTUSER installs $env:APPVER into $userDir and writes nothing machine-wide"
