# Windows build for WinHTTrack (VS2022 v143 + vcpkg).
#
# Fully gating now: the engine ships a modern libhttrack.vcxproj, so the GUI both
# compiles AND links. Build libhttrack from the sibling engine checkout first,
# then WinHTTrack against it, then check the two binaries agree on the CRT.
name: windows-build

on:
  push:
    branches: [master]
    # Releases are tagged bare, like the engine's: 3.49.12, 3.50-beta-1. Match that,
    # and 'v' too in case anyone reaches for it: a 'v*'-only filter never fires.
    tags: ['[0-9]*', 'v*']
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        # A rehearsal for the release: the signing job is otherwise only reachable
        # by tagging, which is a poor place to discover that it does not work.
        description: Run the signing job too (needs approval, and spends signatures)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Cheap guard for the rules .gitattributes cannot enforce on its own.
  encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Byte-exact on purpose: sources are UTF-8, the .rc/tooling inputs stay
      # Latin-1, and a shell guard can't tell them apart. Python decodes strictly.
      - name: Encoding and line endings
        run: |
          python3 - <<'EOF'
          import subprocess, sys

          def tracked(*globs):
              out = subprocess.run(['git', 'ls-files', *globs],
                                   capture_output=True, text=True, check=True).stdout
              return [p for p in out.splitlines() if p]

          SOURCE = tracked('*.cpp', '*.h', '*.c')
          LF_ONLY = tracked('*.cpp', '*.h')
          CRLF_ONLY = tracked('*.rc', '*.rc2', '*.def', '*.idl', '*.rgs', '*.sln',
                              '*.vcproj', '*.vcxproj', '*.props', '*.manifest',
                              '*.dsp', '*.dsw', '*.iss')
          bad = []

          # Sources are UTF-8: a Latin-1 regression (a raw 0xe9) fails this decode.
          for p in SOURCE:
              try:
                  open(p, 'rb').read().decode('utf-8')
              except UnicodeDecodeError as e:
                  bad.append(f'{p}: not valid UTF-8 ({e})')

          # U+FFFD is valid UTF-8 but means a tool mangled the text; fail loudly.
          for p in SOURCE + CRLF_ONLY:
              if b'\xef\xbf\xbd' in open(p, 'rb').read():
                  bad.append(f'{p}: contains U+FFFD; a UTF-8 tool mangled the text')

          for p in LF_ONLY:
              if b'\r' in open(p, 'rb').read():
                  bad.append(f'{p}: has CRLF, must be LF')

          for p in CRLF_ONLY:
              data = open(p, 'rb').read()
              # Every LF must be part of a CRLF. Checking only "has no CRLF at all"
              # would wave through a mixed-ending file, which is how a stray sed
              # insertion slips in.
              if data.replace(b'\r\n', b'') .count(b'\n'):
                  bad.append(f'{p}: has a bare LF, must be CRLF throughout (Windows tooling input)')
              # And a CR with no LF after it, which the check above cannot see: strip the
              # pairs and any CR still standing is a lone one. A stray perl -pe emits these.
              if b'\r' in data.replace(b'\r\n', b''):
                  bad.append(f'{p}: has a lone CR, not part of a CRLF')

          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print(f'OK: {len(SOURCE)} UTF-8 sources, {len(CRLF_ONLY)} Latin-1 CRLF tooling files.')
          EOF

      # A control queried on the page that does not carry it reads as empty or
      # unchecked, silently, and only when that page is realised. That has shipped
      # twice (#53, #54, and the proxy port this runs alongside), so pin it here:
      # the resource file already says which dialog owns which control.
      - name: Option page wiring
        run: |
          python3 - <<'EOF'
          import re, sys

          rc = open('WinHTTrack/WinHTTrack.rc', 'rb').read().decode('latin-1')

          owners, dialogs = {}, {}
          for name, body in re.findall(r'^(IDD_\w+) DIALOGE?X? .*?\r?\n(.*?)^END\r?$',
                                       rc, re.M | re.S):
              ids = set(re.findall(r'\b(IDC_\w+)\b', re.sub(r',\r?\n\s+', ',', body)))
              dialogs[name] = ids
              for i in ids:
                  owners.setdefault(i, set()).add(name)

          bad = []

          def owned_by(ident, dialog, where):
              if ident in owners and dialog not in owners[ident]:
                  bad.append('%s: %s lives on %s' % (where, ident, '/'.join(sorted(owners[ident]))))

          # An option page may only touch controls its own dialog carries.
          for n in range(1, 12):
              page = 'WinHTTrack/OptionTab%d.cpp' % n
              for i in sorted(set(re.findall(r'\b(IDC_\w+)\b', open(page).read()))):
                  owned_by(i, 'IDD_OPTION%d' % n, page)

          # Same rule for the profile code, which reaches into the pages by hand.
          for n, call, i in re.findall(r'm_option(\d+)\.(\w+)\((IDC_\w+)',
                                       open('WinHTTrack/Shell.cpp').read()):
              owned_by(i, 'IDD_OPTION%s' % n, 'Shell.cpp: m_option%s.%s()' % (n, call))

          # Two ids sharing a value on one dialog alias to the same control. Sharing a
          # value across dialogs is fine and several legacy ids do.
          values = {}
          for name, val in re.findall(r'^#define (IDC_\w+)\s+(\d+)',
                                      open('WinHTTrack/resource.h').read(), re.M):
              values.setdefault(val, []).append(name)
          for val, names in values.items():
              for dlg, ids in dialogs.items():
                  clash = sorted(set(names) & ids)
                  if len(clash) > 1:
                      bad.append('%s: %s share id %s' % (dlg, ', '.join(clash), val))

          # A control outside its own page is simply never shown. Option pages only:
          # IDD_inprogress parks its spare transfer rows below its height on purpose.
          for dlg, ids in dialogs.items():
              if not dlg.startswith('IDD_OPTION'):
                  continue
              head = re.search(r'^%s DIALOGE?X? +0, 0, (\d+), (\d+)' % dlg, rc, re.M)
              body = re.search(r'^%s DIALOGE?X? .*?\r?\n(.*?)^END\r?$' % dlg, rc, re.M | re.S)
              w, h = (int(x) for x in head.groups())
              for line in re.sub(r',\r?\n\s+', ',', body.group(1)).splitlines():
                  m = re.search(r'(IDC_\w+)\b.*?,(\d+),(\d+),(\d+),(\d+)\s*(?:,[^,]*)?$', line.strip())
                  if not m:
                      continue
                  x, y, cw, ch = (int(g) for g in m.groups()[1:])
                  if 'COMBOBOX' in line:
                      ch = 0  # a dropdown's height is its popup, not the control
                  if x + cw > w or y + ch > h:
                      bad.append('%s: %s falls outside the %dx%d page' % (dlg, m.group(1), w, h))

          if bad:
              print('\n'.join(sorted(bad)))
              sys.exit(1)
          print('OK: %d dialogs, %d control ids, option pages consistent.'
                % (len(dialogs), len(owners)))
          EOF

      # The signing job runs this script on a tag only, behind an approval, so a
      # typo in it costs a release attempt rather than a build.
      - name: The login script parses and its tray helper compiles
        shell: pwsh
        run: |
          $file = "$PWD/tools/simplysign-login.ps1"
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          # The tray helper is C# in a here-string, invisible to the parser above.
          $pat = '(?s)\$src = @''\r?\n(.*?)\r?\n''@'
          $src = [regex]::Match((Get-Content $file -Raw), $pat).Groups[1].Value
          if (-not $src) { throw 'the C# block was not found: this check would prove nothing' }
          Add-Type -TypeDefinition $src
          Write-Host 'OK: the login script parses and its tray helper compiles.'

  build:
    runs-on: windows-2022
    outputs:
      # Both legs record the same value, so the matrix overwriting it is harmless.
      engine-sha: ${{ steps.provenance.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
        configuration: [Release]
    steps:
      - name: Checkout httrack-windows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: httrack-windows

      # $(HttrackRoot) resolves to ..\httrack, so the engine must be the sibling.
      # coucal is the engine's own submodule.
      - name: Checkout httrack engine (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xroche/httrack
          # Empty follows master, so engine bumps still surface on branch CI at once.
          ref: ${{ vars.HTTRACK_ENGINE_REF }}
          path: httrack
          submodules: recursive

      - name: Help anchors resolve in the engine's guide
        shell: pwsh
        # The GUI deep-links into the engine's guide.html and the engine is unpinned, so a
        # rename upstream lands here silently: the page still opens, it just never scrolls.
        run: |
          $guide = 'httrack\html\guide.html'
          if (-not (Test-Path $guide)) {
            throw "$guide is missing, so every help button would open nothing. The engine " +
                  "predates the guide: move the HTTRACK_ENGINE_REF variable past xroche/httrack a21f84ee."
          }
          $page = Get-Content $guide -Raw
          $anchors = Select-String -Path 'httrack-windows\WinHTTrack\*.cpp' `
                       -Pattern 'HelpTopic\("([^"]+)"\)' -AllMatches |
                     ForEach-Object { $_.Matches } |
                     ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          # Guard the scan itself: a regex that matched nothing would pass the loop below.
          if ($anchors.Count -lt 10) { throw "found only $($anchors.Count) anchors; the scan is broken" }
          foreach ($a in $anchors) {
            if (-not $page.Contains("id=""$a""")) { throw "guide.html has no id='$a'" }
          }
          Write-Host "$($anchors.Count) help anchors resolve in guide.html"

      - name: Record engine provenance
        id: provenance
        shell: pwsh
        # Via env, not ${{ }} interpolation: a value containing $(...) would otherwise run.
        env:
          ENGINE_REF: ${{ vars.HTTRACK_ENGINE_REF }}
          GH_REF: ${{ github.ref }}
        run: |
          $sha = (git -C httrack rev-parse HEAD).Trim()
          Write-Host "::notice::engine $sha (HTTRACK_ENGINE_REF='$env:ENGINE_REF')"
          "sha=$sha" | Out-File -Append $env:GITHUB_OUTPUT
          # Two thirds of what we sign is built from the engine tree, so a tag that floats
          # cannot say what it shipped. A branch name is not a pin, so require a full SHA.
          if ($env:GH_REF -like 'refs/tags/*' -and $env:ENGINE_REF -notmatch '^[0-9a-f]{40}$') {
            throw "Tagged build needs HTTRACK_ENGINE_REF pinned to a 40-hex SHA (got '$env:ENGINE_REF')"
          }

      # Located with vswhere rather than microsoft/setup-msbuild. A repo that
      # restricts Actions to GitHub-owned ones kills a third-party action as a
      # startup_failure with no job, no log and no annotation -- nothing tells you
      # why. vswhere ships on the image, so there is nothing to depend on.
      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw 'no Visual Studio with MSBuild found' }
          $dir = Join-Path $vs 'MSBuild\Current\Bin'
          if (-not (Test-Path (Join-Path $dir 'MSBuild.exe'))) { throw "MSBuild.exe is not in $dir" }
          # Add-Content, not Out-File: the latter writes UTF-16LE under Windows
          # PowerShell and would corrupt GITHUB_PATH if this step's shell ever changed.
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          Write-Host "MSBuild: $dir"

      - name: Enable vcpkg MSBuild integration
        shell: pwsh
        run: |
          # The runner's preinstalled C:\vcpkg is frozen at image-build time and never
          # fetches, so every pinned baseline we build against has to be pulled in first.
          # Both manifests are pinned now (the engine got its own in xroche/httrack#643).
          foreach ($m in 'httrack-windows/WinHTTrack/vcpkg.json', 'httrack/src/vcpkg.json') {
            $baseline = (Get-Content $m -Raw | ConvertFrom-Json).'builtin-baseline'
            if (-not $baseline) { continue }
            git -C C:\vcpkg fetch --depth 1 origin $baseline
            git -C C:\vcpkg cat-file -e "${baseline}:versions/baseline.json"
            if ($LASTEXITCODE -ne 0) { throw "vcpkg baseline $baseline ($m) unreachable after fetch" }
            Write-Host "vcpkg baseline $baseline reachable ($m)"
          }
          vcpkg integrate install

      # WinHTTrack links src\$(Platform)\$(Configuration)\libhttrack.lib, so the
      # engine has to be built first.
      - name: Build libhttrack (engine)
        working-directory: httrack
        shell: pwsh
        run: |
          msbuild src\libhttrack.vcxproj `
            /m `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:VcpkgEnableManifest=true

      # The command-line httrack.exe ships with the GUI, as it always did -- the old
      # installer swept it up with a wildcard, and enumerating files by hand lost it.
      - name: Build httrack (command line)
        working-directory: httrack
        shell: pwsh
        run: |
          msbuild src\httrack.vcxproj `
            /m `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:VcpkgEnableManifest=true

      - name: Build WinHTTrack (compile + link)
        working-directory: httrack-windows
        shell: pwsh
        run: |
          msbuild WinHTTrack\WinHTTrack.vcxproj `
            /m `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:VcpkgEnableManifest=true `
            /flp:LogFile=msbuild.log`;Verbosity=normal

      # The one failure this whole toolchain cannot otherwise catch: if the exe
      # and the DLL disagree on the CRT, they link cleanly and then crash at
      # runtime on a cross-heap free. Assert they share the dynamic CRT.
      - name: Check the exe and libhttrack.dll agree on the CRT
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $tools = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = Join-Path $tools.FullName 'bin\Hostx64\x64\dumpbin.exe'

          $exe = "httrack-windows\WinHTTrack\bin\${{ matrix.platform }}\${{ matrix.configuration }}\WinHTTrack.exe"
          $dll = "httrack\src\${{ matrix.platform }}\${{ matrix.configuration }}\libhttrack.dll"
          # The CLI links the same DLL, so it carries the same cross-heap risk.
          $cli = "httrack\src\${{ matrix.platform }}\${{ matrix.configuration }}\httrack.exe"
          foreach ($f in @($exe, $dll, $cli)) {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }

          function Deps($path) {
            (& $dumpbin /dependents $path) |
              Select-String -Pattern '^\s{4}(\S+\.dll)$' |
              ForEach-Object { $_.Matches[0].Groups[1].Value.ToLower() }
          }
          # The base CRT DLL only, e.g. vcruntime140.dll. On x64 a C++ module that
          # uses exceptions ALSO imports vcruntime140_1.dll (EH continuation
          # metadata); libhttrack is pure C and does not. Comparing the whole
          # vcruntime set would therefore flag a correct build as a mismatch.
          function BaseCrt($deps) {
            @($deps | Where-Object { $_ -match '^vcruntime\d+\.dll$' } | Sort-Object)
          }
          $exeDeps = Deps $exe
          $dllDeps = Deps $dll
          $cliDeps = Deps $cli
          Write-Host "WinHTTrack.exe  -> $($exeDeps -join ', ')"
          Write-Host "libhttrack.dll  -> $($dllDeps -join ', ')"
          Write-Host "httrack.exe     -> $($cliDeps -join ', ')"

          $fail = @()

          # All must import the shared vcruntime. A static-CRT (/MT) build imports
          # none, which is exactly the mismatch that crashes later.
          foreach ($p in @(@{n='WinHTTrack.exe'; d=$exeDeps}, @{n='libhttrack.dll'; d=$dllDeps},
                           @{n='httrack.exe'; d=$cliDeps})) {
            if (-not (BaseCrt $p.d)) {
              $fail += "$($p.n) imports no vcruntime: it was not built with the dynamic CRT (/MD)"
            }
            # A Release build must never pull the debug CRT.
            $dbg = $p.d | Where-Object { $_ -match '^(vcruntime140d|msvcp140d|ucrtbased)\.dll$' }
            if ($dbg) { $fail += "$($p.n) imports a debug CRT: $($dbg -join ', ')" }
          }

          # And they must agree on the SAME base vcruntime, not two different ones.
          $exeRt = BaseCrt $exeDeps
          $dllRt = BaseCrt $dllDeps
          $cliRt = BaseCrt $cliDeps
          if ("$exeRt" -ne "$dllRt") {
            $fail += "CRT mismatch: exe imports [$exeRt] but libhttrack.dll imports [$dllRt]"
          }
          if ("$cliRt" -ne "$dllRt") {
            $fail += "CRT mismatch: httrack.exe imports [$cliRt] but libhttrack.dll imports [$dllRt]"
          }

          if ($fail) { $fail | ForEach-Object { Write-Host "::error::$_" }; exit 1 }

          # A check nobody has watched fail is not a check. Two controls, because the
          # step makes two distinct claims.
          #
          # The filter: cmd.exe links the old msvcrt, not vcruntime140, so the same
          # test must reject it. Assert the parse produced SOMETHING first -- an empty
          # dependency list is falsy, and would otherwise sail through as "rejected",
          # which is the control passing for the wrong reason.
          $ctl = Deps "$env:SystemRoot\System32\cmd.exe"
          if (-not $ctl) { throw 'negative control is vacuous: dumpbin returned no dependents at all for cmd.exe' }
          if (BaseCrt $ctl) { throw 'negative control failed: cmd.exe appears to import vcruntime, so the filter no longer discriminates' }

          # The comparison: the half that actually guards against the cross-heap crash,
          # and the half cmd.exe never exercises. Two different runtimes must compare
          # unequal, and vcruntime140_1 must not be mistaken for a different runtime.
          if ("$(BaseCrt @('vcruntime140.dll'))" -eq "$(BaseCrt @('vcruntime150.dll'))") {
            throw 'the CRT comparison no longer distinguishes two different runtimes'
          }
          if ("$(BaseCrt @('vcruntime140.dll','vcruntime140_1.dll'))" -ne "$(BaseCrt @('vcruntime140.dll'))") {
            throw 'vcruntime140_1 is being counted as a separate runtime again: a correct x64 build would read as a mismatch'
          }
          Write-Host "CRT check passed: both share [$exeRt]. (controls: filter rejects cmd.exe; comparison discriminates)"

      # An invalid embedded manifest does not fail the build: Windows refuses to
      # start the exe with "side-by-side configuration is incorrect", which only
      # shows up on a user's machine. That shipped once, because mt.exe merges
      # manifest inputs by concatenation and MSBuild was quietly adding its own
      # dpiaware.manifest next to ours, leaving two <dpiAware> elements.
      - name: Validate the embedded manifest
        shell: pwsh
        run: |
          $exe = "httrack-windows\WinHTTrack\bin\${{ matrix.platform }}\${{ matrix.configuration }}\WinHTTrack.exe"
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw "mt.exe not found" }
          & $mt.FullName -nologo -inputresource:"$exe;#1" -out:embedded.manifest
          if ($LASTEXITCODE -ne 0) { throw "the exe has no embedded manifest" }

          $txt = Get-Content embedded.manifest -Raw
          try { [xml]$null = $txt } catch { throw "embedded manifest is not well-formed XML: $_" }

          # windowsSettings takes each element at most once; a repeat is what makes
          # the loader reject the whole side-by-side configuration.
          $names = [regex]::Matches($txt, '<(dpiAware|dpiAwareness|longPathAware|heapType)\b') |
                   ForEach-Object { $_.Groups[1].Value }
          $dupes = $names | Group-Object | Where-Object { $_.Count -gt 1 }
          if ($dupes) {
            Write-Host $txt
            throw "embedded manifest repeats: $($dupes.Name -join ', ') -- Windows will refuse to start the app"
          }
          Write-Host "Embedded manifest OK: $($names -join ', ')"

      # Stage a package that actually runs. The OpenSSL and zlib DLLs are NOT
      # beside the exe: the GUI calls neither, so it imports neither, and vcpkg's
      # applocal deploy only copies what the binary it just linked imports. They
      # sit next to libhttrack.dll, which does import them. Take the engine's
      # whole output directory, and assert what has to be there rather than
      # trusting it -- an artifact that looks complete but cannot load is worse
      # than a failed build.
      - name: Stage a runnable package
        shell: pwsh
        # Via env, not ${{ }} interpolation: a value containing $(...) would otherwise run.
        env:
          ENGINE_SHA: ${{ steps.provenance.outputs.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $bin = "httrack-windows\WinHTTrack\bin\${{ matrix.platform }}\${{ matrix.configuration }}"
          $eng = "httrack\src\${{ matrix.platform }}\${{ matrix.configuration }}"
          Copy-Item "$eng\*.dll" $bin
          # The command-line httrack ships with the GUI.
          Copy-Item "$eng\httrack.exe" $bin
          # PDBs stay in the artifact, out of the installer: 2.2 MB to give a user's crash
          # report file:line. The engine's is a bonus, not ours to fix; do not red the build.
          Copy-Item "$eng\*.pdb" $bin -ErrorAction SilentlyContinue
          # lang.def is a FILE at the engine root, not inside lang\. The GUI reads it
          # from the app directory at startup and refuses to run without it. The old
          # installer swept it up with a wildcard; enumerating files by hand lost it.
          # lang.indexes sits next to it and maps the system locale to a language, which
          # is how the first run picks one instead of always starting in English.
          Copy-Item "httrack\lang.def" $bin
          Copy-Item "httrack\lang.indexes" $bin
          foreach ($d in @('lang', 'html', 'templates')) {
            Copy-Item "httrack\$d" (Join-Path $bin $d) -Recurse -Force
          }

          # Ask the binaries what they need rather than hardcoding a list. OpenSSL
          # is libssl-3.dll on x86 but libssl-3-x64.dll on x64, so a fixed list is
          # wrong on one leg and rots on both.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $tools = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = Join-Path $tools.FullName 'bin\Hostx64\x64\dumpbin.exe'
          function Deps($path) {
            (& $dumpbin /dependents $path) |
              Select-String -Pattern '^\s{4}(\S+\.dll)$' |
              ForEach-Object { $_.Matches[0].Groups[1].Value.ToLower() }
          }
          # CRT, MFC and UCRT ship beside the exe instead of through the 25 MB
          # redistributable. The UCRT comes too: Windows 10 has it, Windows 7 SP1 only
          # gets it from KB2999226.
          $rarch = if ('${{ matrix.platform }}' -eq 'x64') { 'x64' } else { 'x86' }
          # Matched to the toolset that compiled the binaries rather than to whatever is
          # newest on the runner: 14.5x is where Windows 7 support ends.
          $tv = [version]$tools.Name
          if ($tv -ge [version]'14.50') { throw "toolset $($tools.Name) is past the 14.4x line, which still supports Windows 7" }
          $vcline = '{0}.{1}.' -f $tv.Major, $tv.Minor
          $vcver = @(Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Where-Object { $_.Name.StartsWith($vcline) } | Sort-Object { [version]$_.Name }) | Select-Object -Last 1
          if (-not $vcver) { throw "no VC++ redist on the $vcline line to match toolset $($tools.Name)" }
          $vcr = @(Get-ChildItem "$($vcver.FullName)\$rarch" -Directory |
            Where-Object { $_.Name -match '^Microsoft\.VC\d+\.(CRT|MFC)$' })
          if ($vcr.Count -lt 2) { throw "no VC++ CRT/MFC redist under $($vcver.FullName)\$rarch" }
          # Both SDK layouts: Redist\ucrt\DLLs\<arch> and Redist\<sdkver>\ucrt\DLLs\<arch>.
          # Newest wins -- merging every installed SDK would ship whichever enumerated last,
          # and the unversioned legacy path sorts first.
          $ucrt = @(Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Redist" -Directory -Recurse -Filter $rarch -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\ucrt\\DLLs\\' } |
            Sort-Object { if ($_.FullName -match '\\Redist\\(\d+(\.\d+){3})\\') { [version]$Matches[1] } else { [version]'0.0.0.0' } }) |
            Select-Object -Last 1
          if (-not $ucrt) { throw 'no UCRT redist in the Windows SDK' }
          $pool = @{}
          foreach ($d in @($vcr) + @($ucrt)) {
            Get-ChildItem $d.FullName -Filter *.dll | ForEach-Object { $pool[$_.Name] = $_.FullName }
          }
          # Seeded from everything already staged, not just our three binaries: OpenSSL and
          # friends are built against the same CRT, so their imports are in the closure too.
          $todo = [Collections.Queue]::new()
          Get-ChildItem $bin -File | Where-Object { $_.Extension -in '.exe', '.dll' } |
            ForEach-Object { $todo.Enqueue($_.Name) }
          # The api-ms-win-crt stubs forward to ucrtbase instead of importing it, so no
          # dependency walk ever names it.
          if (-not $pool.ContainsKey('ucrtbase.dll')) { throw 'the SDK UCRT redist has no ucrtbase.dll' }
          $todo.Enqueue('ucrtbase.dll')
          $seen = @{}
          $staged = @{}
          while ($todo.Count) {
            $n = $todo.Dequeue()
            if ($seen.ContainsKey($n)) { continue }
            $seen[$n] = $true
            $here = Join-Path $bin $n
            if (-not (Test-Path $here)) {
              # Ours to ship if the redist has it; anything else Windows supplies.
              if (-not $pool.ContainsKey($n)) { continue }
              Copy-Item $pool[$n] $bin
              $staged[$n] = $true
            }
            Deps $here | ForEach-Object { $todo.Enqueue($_) }
          }
          if (-not $staged.Count) { throw 'no runtime DLL was staged: the redist layout moved' }
          if (-not (Test-Path (Join-Path $bin 'ucrtbase.dll'))) { throw 'ucrtbase.dll was not staged' }
          Write-Host "--- app-local runtime: $($staged.Count) DLLs from $($vcver.Name) ---"
          # What the sign job must leave alone. It cannot infer this from signature status:
          # a Microsoft DLL that fails to verify on the runner would land in our bucket.
          Set-Content (Join-Path $bin 'runtime-vendored.txt') ($staged.Keys | Sort-Object)

          # Supplied by Windows itself. The CRT names are gone from this list on purpose:
          # they are ours to ship now, so the check below catches a staging regression.
          $provided = '^(api-ms-win-(?!crt-)|kernel32|user32|advapi32|shell32|comctl32|ole32|oleaut32|ws2_32|winmm|gdi32|shlwapi)'
          $needed = @(Deps "$bin\WinHTTrack.exe") + @(Deps "$bin\httrack.exe") + @(Deps "$bin\libhttrack.dll") |
            Where-Object { $_ -notmatch $provided } | Sort-Object -Unique
          Write-Host "--- must ship: $($needed -join ', ') ---"
          foreach ($d in $needed) {
            if (-not (Test-Path (Join-Path $bin $d))) { throw "package is missing $d" }
          }
          if (-not (Test-Path (Join-Path $bin 'lang\English.txt'))) {
            throw "package is missing lang/: the GUI would start with no interface strings"
          }
          if (-not (Test-Path (Join-Path $bin 'lang.def'))) {
            throw "package is missing lang.def: the GUI refuses to start without it"
          }
          if (-not (Test-Path (Join-Path $bin 'lang.indexes'))) {
            throw "package is missing lang.indexes: the first run would ignore the system locale"
          }
          if (-not (Test-Path (Join-Path $bin 'httrack.exe'))) {
            throw "package is missing httrack.exe: the command-line version ships with the GUI"
          }
          # Staged, not installed: the check below needs them, and they make the artifact debuggable.
          if (-not (Test-Path (Join-Path $bin 'WinHTTrack.pdb'))) {
            throw "package is missing WinHTTrack.pdb: the crash-symbol check would prove nothing"
          }
          if (-not (Test-Path (Join-Path $bin 'libhttrack.pdb'))) {
            Write-Host "::warning::no libhttrack.pdb: engine frames will not resolve"
          }

          # src/ no longer ships; the GPL offer names the exact commits instead. coucal is
          # a submodule, so a GitHub archive of the engine carries an empty src/coucal and
          # naming it separately is what keeps the offer complete.
          # On a pull_request HEAD is the ephemeral merge commit, whose URLs die with the
          # PR; the head commit is the one that was built.
          $guiSha = if ($env:PR_HEAD_SHA) { $env:PR_HEAD_SHA } else { (git -C httrack-windows rev-parse HEAD).Trim() }
          $engSha = $env:ENGINE_SHA
          $couSha = (git -C httrack/src/coucal rev-parse HEAD).Trim()
          foreach ($p in @(@('gui', $guiSha), @('engine', $engSha), @('coucal', $couSha))) {
            if ($p[1] -notmatch '^[0-9a-f]{40}$') { throw "cannot name the corresponding source: $($p[0])='$($p[1])'" }
          }
          Set-Content (Join-Path $bin 'source.txt') @"
          WinHTTrack Website Copier is free software under the GNU GPL, version 3 or
          later. See license.txt for the terms.

          The complete corresponding source for this exact build:

            Windows interface  https://github.com/xroche/httrack-windows/tree/$guiSha
            Engine             https://github.com/xroche/httrack/tree/$engSha
            coucal (in engine) https://github.com/xroche/coucal/tree/$couSha

          Downloadable archives of those revisions. coucal has to be taken separately:
          it is a submodule, so the engine archive carries an empty src/coucal.

            https://github.com/xroche/httrack-windows/archive/$guiSha.tar.gz
            https://github.com/xroche/httrack/archive/$engSha.tar.gz
            https://github.com/xroche/coucal/archive/$couSha.tar.gz
          "@

          Set-Content (Join-Path $bin 'README-artifact.txt') @'
          This is a CI build of WinHTTrack, not an installer.

          Everything it needs is in this folder, including the Microsoft Visual C++
          runtime and the UCRT, so there is no redistributable to install first.
          Windows 7 SP1 is the exception: the runtime also needs KB2533623, which
          only Windows Update can supply.

          httrack.exe is the command-line version, against the same libhttrack.dll.
          '@
          Write-Host "--- package contents ---"
          Get-ChildItem $bin | ForEach-Object { Write-Host "  $($_.Name)" }

      # Against the staged tree, where the PDBs live: the installed build can no longer
      # resolve a line, so this is what still proves the whole crash-report chain works.
      - name: Crash report resolves to function, file and line
        shell: pwsh
        run: |
          $bin = "httrack-windows\WinHTTrack\bin\${{ matrix.platform }}\${{ matrix.configuration }}"
          $report = Join-Path $env:TEMP 'WinHTTrack-exception.txt'
          # -Force, then prove it: the report is opened for APPEND, so a leftover (or a
          # read-only file planted at that path) would be asserted against instead.
          Remove-Item $report -Force -ErrorAction SilentlyContinue
          if (Test-Path $report) { throw "$report survived deletion: the check would read someone else's content" }
          # --selftest throws one exception on purpose.
          $p = Start-Process (Join-Path $bin 'WinHTTrack.exe') -ArgumentList '--selftest' -Wait -PassThru `
                 -RedirectStandardOutput "$PWD\crash-st.txt" -RedirectStandardError "$PWD\crash-st.err"
          if ($p.ExitCode -ne 0) { throw "--selftest exited $($p.ExitCode) from the staged tree" }
          if (-not (Test-Path $report)) { throw 'no crash report written: the first-chance hook never ran' }
          $trace = Get-Content $report -Raw
          Write-Host "--- crash report ---`n$trace"
          if ($trace -notmatch 'throw site') { throw 'report holds the handler stack, not the throw stack' }
          # Tempered so the match cannot run past the throw-site record into a later one:
          # CrashReportLogException is itself called from WinHTTrack.cpp, so the handler
          # record would satisfy an unbounded match with the hook dead.
          if ($trace -notmatch 'throw site\):(?:(?!Stack trace)[\s\S])*?WinHTTrack\.cpp:\d+') {
            throw 'no file:line on the throw stack: the PDB carries no line info'
          }
          Write-Host '::notice::crash report resolves function, file and line'

      # Self-imposed now that no CA enforces it: every shipped binary must carry the
      # product name and the version of the tree that stamped it. The GUI has its own
      # now, so it is held to version.h and the engine's two binaries to htsglobal.h.
      - name: Check the binaries agree on product name and version
        shell: pwsh
        run: |
          $bin = "httrack-windows\WinHTTrack\bin\${{ matrix.platform }}\${{ matrix.configuration }}"
          $hg = Get-Content 'httrack\src\htsglobal.h' -Raw
          if ($hg -notmatch '#define\s+HTTRACK_VERSION\s+"([^"]+)"') { throw 'cannot read HTTRACK_VERSION' }
          $engine = $Matches[1]
          $vh = Get-Content 'httrack-windows\WinHTTrack\version.h' -Raw
          if ($vh -notmatch '#define\s+WINHTTRACK_VERSION\s+"([^"]+)"') { throw 'cannot read WINHTTRACK_VERSION' }
          $gui = $Matches[1]
          $name = 'HTTrack Website Copier'

          $bad = @()
          foreach ($f in @(@{n='WinHTTrack.exe'; v=$gui}, @{n='httrack.exe'; v=$engine}, @{n='libhttrack.dll'; v=$engine})) {
            $v = (Get-Item (Join-Path $bin $f.n)).VersionInfo
            # Trim: resource compilers pad these fields, and Inno certainly does.
            $pn = "$($v.ProductName)".Trim()
            $pv = "$($v.ProductVersion)".Trim()
            Write-Host "  $($f.n) : ProductName='$pn' ProductVersion='$pv'"
            if ($pn -ne $name) { $bad += "$($f.n) names the product '$pn', not '$name'" }
            if ($pv -ne $f.v) { $bad += "$($f.n) is version '$pv', not '$($f.v)'" }
          }
          if ($bad) { throw ($bad -join "`n") }

          # The .rc takes its version string and its comma form from two macros, so a
          # bump that edits one and not the other ships a file disagreeing with itself.
          if ($vh -notmatch '#define\s+WINHTTRACK_VERSIONID\s+"([^"]+)"') { throw 'cannot read WINHTTRACK_VERSIONID' }
          $verid = $Matches[1]
          $fv = (Get-Item (Join-Path $bin 'WinHTTrack.exe')).VersionInfo
          $num = "$($fv.FileMajorPart).$($fv.FileMinorPart).$($fv.FileBuildPart).$($fv.FilePrivatePart)"
          if ($num -ne $verid) { throw "WinHTTrack.exe is numbered $num, but WINHTTRACK_VERSIONID says $verid" }
          if ("$($fv.FileVersion)".Trim() -ne $verid) { throw "WinHTTrack.exe FileVersion is '$($fv.FileVersion)', not '$verid'" }

          Write-Host "::notice::all three binaries report $name, the GUI at $gui and the engine at $engine"

      # vcpkg is invisible to Dependabot alerts, CodeQL and the dependency graph, so
      # this is the only thing between a stale OpenSSL and a signed installer. Advisory
      # on branches, fatal on tags. The engine tree is what ships (the GUI imports
      # neither library); the GUI tree is scanned too and cross-checked against its pin.
      - name: Check shipped native dependencies for advisories
        shell: pwsh
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          ACCEPTED: ${{ vars.SECURITY_ACCEPTED_CVES }}
        run: |
          $expectArg = @()
          # Cross-check against the ENGINE's pin: its tree is what the installer ships and
          # is scanned first-wins below, so the GUI baseline would compare the wrong thing.
          $baseline = (Get-Content httrack/src/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if ($baseline) {
            $url = "https://raw.githubusercontent.com/microsoft/vcpkg/$baseline/versions/baseline.json"
            $expect = (Invoke-RestMethod $url).default.openssl.baseline
            Write-Host "engine pin resolves openssl to $expect"
            $expectArg = @('--expect-openssl', $expect)
          }
          # Engine tree first: its DLLs are the ones the installer ships.
          python httrack-windows/tools/check-native-deps.py `
            --installed httrack/src/vcpkg_installed httrack-windows/WinHTTrack/vcpkg_installed `
            --min-severity moderate --accept "$env:ACCEPTED" @expectArg
          if ($LASTEXITCODE -ne 0) { throw 'native dependency check failed' }

      - name: Build the installer
        id: installer
        uses: ./httrack-windows/.github/actions/build-installer
        with:
          payload-dir: ${{ github.workspace }}\httrack-windows\WinHTTrack\bin\${{ matrix.platform }}\${{ matrix.configuration }}
          engine-dir: ${{ github.workspace }}\httrack
          gui-dir: ${{ github.workspace }}\httrack-windows
          arch: ${{ matrix.platform == 'x64' && 'x64' || 'x86' }}
          out-dir: ${{ github.workspace }}\installer

      - name: Install it, run it, uninstall it
        uses: ./httrack-windows/.github/actions/smoke-test
        with:
          setup: ${{ steps.installer.outputs.setup }}
          version: ${{ steps.installer.outputs.version }}
          engine-version: ${{ steps.installer.outputs.engine-version }}

      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: httrack-setup-${{ matrix.platform }}
          path: installer/*.exe
          if-no-files-found: error

      - name: Upload the runnable build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WinHTTrack-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            httrack-windows/WinHTTrack/bin/${{ matrix.platform }}/${{ matrix.configuration }}/**
            !**/*.iobj
            !**/*.ipdb
            !**/*.exp

      - name: Upload MSBuild log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msbuild-${{ matrix.platform }}-${{ matrix.configuration }}
          path: httrack-windows/msbuild.log
          if-no-files-found: ignore

  # A GitHub environment gates a whole job, so signing cannot live in the build job:
  # that job would carry the required-reviewer approval and every pull request would
  # stop dead waiting for a click. One job for both architectures rather than a
  # matrix, because a SimplySign session belongs to one machine and two runners would
  # mint the same single-use TOTP code in the same window.
  sign:
    # A workflow_dispatch from a tag ref used to reach this whatever `sign` said.
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.sign) }}
    needs: build
    runs-on: windows-2022
    environment: signing
    # Two tags pushed at once would fight over the signing session.
    concurrency: certum-signing
    permissions:
      contents: read
      # download-artifact reads this run's artifacts through the Actions API.
      actions: read
    env:
      # Public material; the certificate itself is RSA-4096, valid to 2027-07-28.
      THUMBPRINT: AEEE0C1672811FEBB33099FB433FC0D70E5B89C2
      MSI_URL: https://files.certum.eu/software/SimplySignDesktop/Windows/9.4.4.92/SimplySignDesktop-9.4.4.92-64-bit-en.msi
      MSI_SHA256: 8ec420fc27798b86078b7bd02fe7152097e1b3005bab51820eaca8e57df84da3
    steps:
      # An empty value would check out the engine's master instead, silently
      # packaging sources that never went through the build job.
      - name: Check the engine SHA came through
        shell: pwsh
        run: |
          if ('${{ needs.build.outputs.engine-sha }}' -notmatch '^[0-9a-f]{40}$') {
            throw 'the build job recorded no engine SHA'
          }

      - name: Checkout httrack-windows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: httrack-windows

      # The installer packs the engine's licence and history files, so the sign job needs
      # the same two checkouts the build job had, at the exact commit that was built.
      - name: Checkout httrack engine (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xroche/httrack
          ref: ${{ needs.build.outputs.engine-sha }}
          path: httrack
          submodules: recursive

      # The very binaries the build job smoke-tested, rather than a fresh compile.
      - name: Download the tested binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: WinHTTrack-*-Release
          path: payload

      - name: Locate signtool
        shell: pwsh
        run: |
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                  Where-Object FullName -like '*\x64\*' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $st) { throw 'no signtool.exe in the Windows SDK' }
          # On PATH because Inno's [SignTool] runs it by name too.
          Add-Content -Path $env:GITHUB_PATH -Value $st.DirectoryName
          Write-Host "signtool: $($st.FullName)"

      - name: Install SimplySign Desktop
        shell: pwsh
        run: |
          $msi = "$PWD\SimplySignDesktop.msi"
          Invoke-WebRequest $env:MSI_URL -OutFile $msi
          $got = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:MSI_SHA256) { throw "MSI is $got, not $env:MSI_SHA256" }

          # It installs a virtual smart-card driver, so verify who produced the bytes.
          $sig = Get-AuthenticodeSignature $msi
          if ($sig.Status -ne 'Valid') { throw "MSI signature is $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch 'O=Asseco Data Systems S\.A\.') {
            throw "MSI signed by an unexpected party: $($sig.SignerCertificate.Subject)"
          }
          Write-Host "MSI verified: $($sig.SignerCertificate.Subject)"

          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/i', $msi, '/quiet', '/norestart'
          # 3010 is "success, reboot required" -- fine, the driver loads anyway.
          if ($p.ExitCode -notin 0, 3010) { throw "msiexec exited $($p.ExitCode)" }
          $exe = 'C:\Program Files\Certum\SimplySign Desktop\SimplySignDesktop.exe'
          if (-not (Test-Path $exe)) { throw "not where 9.4.4.92 installs: $exe" }
          "SSD_EXE=$exe" | Out-File -Append $env:GITHUB_ENV

      # Opens a two-hour window in which signtool can use the cloud key; everything
      # below has to happen inside it.
      - name: Sign in to SimplySign
        shell: pwsh
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
        run: >
          ./httrack-windows/tools/simplysign-login.ps1
          -Exe "$env:SSD_EXE" -Thumbprint $env:THUMBPRINT

      - name: Sign the binaries
        shell: pwsh
        run: |
          # Nothing downstream would notice this loop running zero times: it would
          # sign nothing and exit 0.
          $dirs = @(Get-ChildItem payload -Directory)
          if ($dirs.Count -ne 2) { throw "expected both architectures under payload\, found $($dirs.Count)" }
          foreach ($d in $dirs) {
            # Sign what is there rather than a fixed list: OpenSSL is libssl-3.dll on
            # x86 but libssl-3-x64.dll on x64. Recursive because the installer packs
            # subdirectories, so a PE below the top level would otherwise ship unsigned.
            $all = @(Get-ChildItem $d.FullName -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' })
            # Whose file it is comes from the build job's manifest, never from whether a
            # signature verifies here: signtool REPLACES, so an unverifiable Microsoft DLL
            # would come back carrying our certificate.
            $manifest = Join-Path $d.FullName 'runtime-vendored.txt'
            if (-not (Test-Path $manifest)) { throw "$($d.Name) has no runtime-vendored.txt" }
            $vendored = @{}
            Get-Content $manifest | Where-Object { $_.Trim() } | ForEach-Object { $vendored[$_.Trim()] = $true }
            if (-not $vendored.Count) { throw "$($d.Name): runtime-vendored.txt is empty" }
            $pes = @()
            foreach ($f in $all) {
              if (-not $vendored.ContainsKey($f.Name)) { $pes += $f; continue }
              # Theirs, and it has to still say so: packaging must not have stripped it.
              $sig = Get-AuthenticodeSignature $f.FullName
              if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
                throw "$($f.Name) is vendored but carries no valid Microsoft signature ($($sig.Status))"
              }
            }
            foreach ($f in 'WinHTTrack.exe', 'httrack.exe', 'libhttrack.dll') {
              if ($f -notin $pes.Name) { throw "$($d.Name) has no $f to sign" }
            }
            Write-Host "--- $($d.Name): $($pes.Count) to sign, $($vendored.Count) vendored ---"
            foreach ($f in $pes) {
              # Every file is a fresh call to the timestamp server; one hiccup should
              # not cost a release.
              for ($try = 1; ; $try++) {
                signtool sign /sha1 $env:THUMBPRINT /fd sha256 /tr http://time.certum.pl /td sha256 $f.FullName
                if ($LASTEXITCODE -eq 0) { break }
                if ($try -ge 3) { throw "signtool exited $LASTEXITCODE on $($f.Name)" }
                Start-Sleep -Seconds 15
              }
              $sig = Get-AuthenticodeSignature $f.FullName
              if ($sig.SignerCertificate.Thumbprint -ne $env:THUMBPRINT) {
                throw "$($f.Name) came back signed by $($sig.SignerCertificate.Thumbprint)"
              }
              if (-not $sig.TimeStamperCertificate) { throw "$($f.Name) carries no RFC 3161 timestamp" }
              Write-Host "  signed $($f.Name)"
            }
          }

      # Rebuilt from the signed binaries, because Inno packs them as opaque bytes:
      # signing the installer afterwards would leave everything inside it unsigned.
      # /DSign also gets the embedded uninstaller signed, which is the one file that
      # could never be reached from outside.
      - name: Build the signed installer (x64)
        id: x64
        uses: ./httrack-windows/.github/actions/build-installer
        with:
          payload-dir: ${{ github.workspace }}\payload\WinHTTrack-x64-Release
          engine-dir: ${{ github.workspace }}\httrack
          gui-dir: ${{ github.workspace }}\httrack-windows
          arch: x64
          out-dir: ${{ github.workspace }}\installer
          sign: 'true'
          thumbprint: ${{ env.THUMBPRINT }}

      # Win32 is the platform the build job names; x86 is what the installer calls it.
      - name: Build the signed installer (x86)
        id: x86
        uses: ./httrack-windows/.github/actions/build-installer
        with:
          payload-dir: ${{ github.workspace }}\payload\WinHTTrack-Win32-Release
          engine-dir: ${{ github.workspace }}\httrack
          gui-dir: ${{ github.workspace }}\httrack-windows
          arch: x86
          out-dir: ${{ github.workspace }}\installer
          sign: 'true'
          thumbprint: ${{ env.THUMBPRINT }}

      # Published before they are tested, not after: the previous run signed
      # everything and then lost it all when a later check failed.
      - name: Upload the signed installers
        id: installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: httrack-setup-signed
          path: installer/*.exe
          if-no-files-found: error

      - name: Upload the signed binaries
        id: binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: httrack-signed-binaries
          path: payload/**
          if-no-files-found: error

      # A log line nobody can click is not a delivery. The run summary renders
      # these as links at the top of the run page.
      - name: Say where the signed artifacts are
        shell: pwsh
        env:
          INSTALLERS: ${{ steps.installers.outputs.artifact-url }}
          BINARIES: ${{ steps.binaries.outputs.artifact-url }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # artifact-url is empty on older action versions; the run page always works.
          $inst = if ($env:INSTALLERS) { $env:INSTALLERS } else { "$env:RUN#artifacts" }
          $bins = if ($env:BINARIES) { $env:BINARIES } else { "$env:RUN#artifacts" }
          @(
            '## Signed build'
            ''
            "**[Download the signed installers]($inst)** (both architectures)"
            ''
            "[Signed binaries]($bins), and the whole run at [$env:RUN]($env:RUN)"
          ) | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Write-Host "::notice title=Signed installers::$inst"
          Write-Host "::notice title=Signed binaries::$bins"

      # Same test the build job runs, over the file that will actually be published,
      # plus the signatures: on the installer before it runs, and on everything it
      # lays down afterwards.
      - name: Install it, run it, uninstall it (x64)
        uses: ./httrack-windows/.github/actions/smoke-test
        with:
          setup: ${{ steps.x64.outputs.setup }}
          version: ${{ steps.x64.outputs.version }}
          engine-version: ${{ steps.x64.outputs.engine-version }}
          thumbprint: ${{ env.THUMBPRINT }}
          require-signature: 'true'
          check-crash-report: 'false'
