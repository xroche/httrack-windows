name: native dependency watch

# Weekly, no build: opens/updates one issue when the pinned baseline drifts from
# vcpkg master or when the pinned OpenSSL gains an advisory. The hard gate lives in
# windows-build.yml; this only warns, so it is allowed to be noisy.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both pins, not just ours. The installer ships DLLs built from the ENGINE's
      # baseline, so watching only WinHTTrack/vcpkg.json covers the engine's OpenSSL
      # by the accident of the two being equal. The run that matters is the one where
      # they are not.
      - name: Compare both pinned baselines against vcpkg master
        id: drift
        run: |
          set -euo pipefail
          GUI=$(python3 -c 'import json;print(json.load(open("WinHTTrack/vcpkg.json"))["builtin-baseline"])')
          # Fail loudly rather than watching one pin and calling it a clean week.
          curl -sSf "https://raw.githubusercontent.com/xroche/httrack/master/src/vcpkg.json" -o engine-vcpkg.json
          ENGINE=$(python3 -c 'import json;print(json.load(open("engine-vcpkg.json"))["builtin-baseline"])')
          for ref in "$GUI" "$ENGINE" master; do
            [ -f "bl-$ref.json" ] || curl -sSf "https://raw.githubusercontent.com/microsoft/vcpkg/$ref/versions/baseline.json" -o "bl-$ref.json"
          done
          python3 tools/check-pin-drift.py --upstream bl-master.json \
            --pin "GUI=$GUI:bl-$GUI.json" --pin "engine=$ENGINE:bl-$ENGINE.json" \
            --versions-out openssl-versions.txt | tee drift.txt
          grep -q DRIFT drift.txt && echo "drift=yes" >> "$GITHUB_OUTPUT" || true

      - name: Check every pinned OpenSSL against the advisory feed
        id: cve
        continue-on-error: true
        env:
          ACCEPTED: ${{ vars.SECURITY_ACCEPTED_CVES }}
        run: |
          set -uo pipefail
          # Every version, not the first: a clean GUI pin must not vouch for the engine's.
          # No `set -e`, so one bad version still lets the other be reported.
          rc=0
          while read -r version who; do
            echo "--- $version ($who) ---"
            python3 tools/check-native-deps.py --openssl-version "$version" \
              --min-severity moderate --accept "$ACCEPTED" || rc=1
          done < openssl-versions.txt
          exit $rc

      - name: Open or update the tracking issue
        if: steps.drift.outputs.drift == 'yes' || steps.cve.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Native dependency drift"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file drift.txt
          else
            # gh drops the whole issue when the label is missing, so label after filing.
            url=$(gh issue create --title "$title" --body-file drift.txt)
            gh issue edit "$url" --add-label security || true
          fi
