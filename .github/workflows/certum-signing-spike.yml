# Throwaway experiment: can a GitHub-hosted Windows runner log into Certum's
# SimplySign Desktop unattended, so signing stays on the official vendor stack
# (Certum's MSI + Microsoft's signtool) instead of a third-party client?
#
# The unknown is the login: it is a Qt dialog with no CLI, so the only way in is
# generating the TOTP from the otpauth:// seed and typing it with SendKeys. That
# is blind and timing-dependent, which is exactly why this runs before anything
# is designed around it. Success is one assertion: the certificate reaches
# CurrentUser\My. Delete this file once the answer is known either way.
name: certum-signing-spike

on:
  # workflow_dispatch only registers from the default branch, and this file is not
  # going there, so pushing the branch is what runs it. The environment gate still
  # holds the job until it is approved.
  push:
    branches: [certum-signing-spike]
  workflow_dispatch:
    inputs:
      sign_probe:
        description: 'Also sign a throwaway file (spends one signature, proves the key is usable)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Public material: see httrack-works/windows-modernization/codesign/README.md.
  THUMBPRINT: AEEE0C1672811FEBB33099FB433FC0D70E5B89C2
  MSI_URL: https://files.certum.eu/software/SimplySignDesktop/Windows/9.4.4.92/SimplySignDesktop-9.4.4.92-64-bit-en.msi
  MSI_SHA256: 8ec420fc27798b86078b7bd02fe7152097e1b3005bab51820eaca8e57df84da3

jobs:
  spike:
    runs-on: windows-2022
    # Required-reviewer gate, so the seed is never a plain repo secret -- not even
    # during the experiment.
    environment: signing
    steps:
      - name: Fetch and verify SimplySign Desktop
        shell: pwsh
        run: |
          $msi = "$PWD\SimplySignDesktop.msi"
          Invoke-WebRequest $env:MSI_URL -OutFile $msi
          $got = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:MSI_SHA256) { throw "MSI is $got, not $env:MSI_SHA256" }

          # It installs a virtual smart-card driver, so verify who produced the bytes.
          $sig = Get-AuthenticodeSignature $msi
          if ($sig.Status -ne 'Valid') { throw "MSI signature is $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch 'O=Asseco Data Systems S\.A\.') {
            throw "MSI signed by an unexpected party: $($sig.SignerCertificate.Subject)"
          }
          Write-Host "MSI verified: $($sig.SignerCertificate.Subject)"

      - name: Install it
        shell: pwsh
        run: |
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList `
            '/i', "$PWD\SimplySignDesktop.msi", '/quiet', '/norestart', '/l*v', "$PWD\msi-install.log"
          # 3010 is "success, reboot required" -- fine, the driver loads anyway.
          if ($p.ExitCode -notin 0, 3010) { throw "msiexec exited $($p.ExitCode)" }

          # Where 9.4.4.92 landed; fall back to a scan so a version bump that moves it
          # fails with a candidate list rather than a bare "not found".
          $found = @(Get-Item 'C:\Program Files\Certum\SimplySign Desktop\SimplySignDesktop.exe' -ErrorAction SilentlyContinue)
          if (-not $found) {
            $found = @(Get-ChildItem 'C:\Program Files', 'C:\Program Files (x86)' -Recurse `
                         -Filter '*SimplySign*.exe' -ErrorAction SilentlyContinue)
          }
          $found | ForEach-Object { Write-Host "  candidate: $($_.FullName)" }
          $exe = $found | Where-Object Name -eq 'SimplySignDesktop.exe' | Select-Object -First 1
          if (-not $exe) { $exe = $found | Select-Object -First 1 }
          if (-not $exe) { throw 'no SimplySign executable found after install' }
          Write-Host "installed: $($exe.FullName)"
          "SSD_EXE=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV

      - name: Log in and wait for the certificate
        id: login
        shell: pwsh
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
        run: |
          function ConvertFrom-Base32([string]$s) {
            $alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'
            $bits = -join (($s -replace '[=\s]', '').ToUpper().ToCharArray() | ForEach-Object {
              $i = $alphabet.IndexOf($_)
              if ($i -lt 0) { throw 'the seed is not valid base32' }
              [Convert]::ToString($i, 2).PadLeft(5, '0')
            })
            [byte[]]@(for ($i = 0; $i + 8 -le $bits.Length; $i += 8) { [Convert]::ToByte($bits.Substring($i, 8), 2) })
          }

          if (-not $env:CERTUM_OTP_URI) {
            throw 'CERTUM_OTP_URI is empty: set it as a secret on the "signing" environment'
          }
          if (-not $env:CERTUM_EMAIL) { throw 'CERTUM_EMAIL is empty' }

          # Honour the URI's own algorithm: Certum issues SHA-256 seeds, and every
          # naive TOTP snippet assumes SHA-1 and silently emits wrong codes.
          $q = @{}
          foreach ($kv in (($env:CERTUM_OTP_URI -replace '^[^?]*\??', '') -split '&')) {
            $p = $kv -split '=', 2
            if ($p.Count -eq 2) { $q[$p[0].ToLower()] = [uri]::UnescapeDataString($p[1]) }
          }
          $secret = if ($q['secret']) { $q['secret'] } else { $env:CERTUM_OTP_URI }
          $alg = if ($q['algorithm']) { $q['algorithm'].ToUpper() } else { 'SHA1' }
          $digits = if ($q['digits']) { [int]$q['digits'] } else { 6 }
          $period = if ($q['period']) { [int]$q['period'] } else { 30 }
          Write-Host "seed: algorithm=$alg digits=$digits period=$period"

          $key = ConvertFrom-Base32 $secret
          $counter = [long][math]::Floor([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() / $period)
          $cb = [BitConverter]::GetBytes($counter); [array]::Reverse($cb)
          $hmac = switch ($alg) {
            'SHA256' { [System.Security.Cryptography.HMACSHA256]::new($key) }
            'SHA512' { [System.Security.Cryptography.HMACSHA512]::new($key) }
            default { [System.Security.Cryptography.HMACSHA1]::new($key) }
          }
          $h = $hmac.ComputeHash($cb)
          $o = $h[$h.Length - 1] -band 0x0f
          $bin = (($h[$o] -band 0x7f) -shl 24) -bor (($h[$o + 1] -band 0xff) -shl 16) -bor `
                 (($h[$o + 2] -band 0xff) -shl 8) -bor ($h[$o + 3] -band 0xff)
          $otp = ($bin % [int][math]::Pow(10, $digits)).ToString().PadLeft($digits, '0')
          Write-Host "::add-mask::$otp"

          Write-Host "certificates before login: $((Get-ChildItem Cert:\CurrentUser\My).Count)"

          # Hand the binary back so it can be analysed offline instead of over
          # approval-gated round trips. The bundled JRE is noise; skip it.
          New-Item -ItemType Directory -Force loot | Out-Null
          Get-ChildItem 'C:\Program Files\Certum' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\jre\\' } | ForEach-Object {
              Write-Host "  $($_.FullName)"
              if ($_.Length -lt 20MB -and $_.Extension -in '.exe', '.config', '.dll', '.bat', '.ini', '.txt') {
                Copy-Item $_.FullName loot -ErrorAction SilentlyContinue
              }
            }

          Write-Host '--- SimplySignDesktop.exe.config ---'
          Get-Content "$(Split-Path $env:SSD_EXE)\SimplySignDesktop.exe.config" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $_" }

          Write-Host '--- does it take arguments? ---'
          $h = Start-Process $env:SSD_EXE -ArgumentList '--help' -PassThru -NoNewWindow `
                 -RedirectStandardOutput help-out.txt -RedirectStandardError help-err.txt
          if (-not $h.WaitForExit(15000)) { $h.Kill(); Write-Host '  (--help did not exit; no CLI)' }
          foreach ($f in 'help-out.txt', 'help-err.txt') {
            $t = (Get-Content $f -Raw -ErrorAction SilentlyContinue)
            if ($t) { Write-Host "  ${f}: $t" }
          }

          # It is a tray application: the first run showed no window at all, so there was
          # nothing for AppActivate to focus. Find out what it does expose before typing.
          $proc = Start-Process -FilePath $env:SSD_EXE -PassThru
          Start-Sleep -Seconds 25
          Write-Host "alive after 25s: $(-not $proc.HasExited)"
          if ($proc.HasExited) { Write-Host "  exited with $($proc.ExitCode)" }
          Get-Process | Where-Object { $_.MainWindowHandle -ne 0 } | ForEach-Object {
            Write-Host "  window: $($_.ProcessName) -- '$($_.MainWindowTitle)'"
          }

          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $any = [System.Windows.Automation.Condition]::TrueCondition
          $desc = [System.Windows.Automation.TreeScope]::Descendants

          # The tray, including the overflow flyout the icon probably hides in.
          foreach ($cls in 'Shell_TrayWnd', 'NotifyIconOverflowWindow', 'TopLevelWindowForOverflowXamlIsland') {
            $c = New-Object System.Windows.Automation.PropertyCondition(
                   [System.Windows.Automation.AutomationElement]::ClassNameProperty, $cls)
            $w = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $c)
            if (-not $w) { Write-Host "  ($cls not present)"; continue }
            foreach ($e in $w.FindAll($desc, $any)) {
              $n = $e.Current.Name
              if ($n) { Write-Host "  $cls : [$($e.Current.ControlType.ProgrammaticName)] '$n'" }
            }
          }

          # Every top-level window, named or not: a Qt login dialog may have no title.
          Write-Host '--- top-level windows ---'
          foreach ($e in $root.FindAll([System.Windows.Automation.TreeScope]::Children, $any)) {
            Write-Host "  [$($e.Current.ClassName)] '$($e.Current.Name)' (pid $($e.Current.ProcessId))"
          }

          # Server 2022 hides new tray icons: the overflow flyout does not exist until
          # the chevron is clicked, which is why it read as "not present" above.
          $chevron = $null
          $c = New-Object System.Windows.Automation.PropertyCondition(
                 [System.Windows.Automation.AutomationElement]::ClassNameProperty, 'Shell_TrayWnd')
          $tray = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $c)
          if ($tray) {
            foreach ($e in $tray.FindAll($desc, $any)) {
              if ($e.Current.Name -match 'chevron|hidden icons') { $chevron = $e }
            }
          }
          if ($chevron) {
            Write-Host "opening the tray overflow via '$($chevron.Current.Name)'"
            $chevron.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Start-Sleep -Seconds 3
            $c2 = New-Object System.Windows.Automation.PropertyCondition(
                    [System.Windows.Automation.AutomationElement]::ClassNameProperty, 'NotifyIconOverflowWindow')
            $ov = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $c2)
            if ($ov) {
              foreach ($e in $ov.FindAll($desc, $any)) {
                Write-Host "  overflow: [$($e.Current.ControlType.ProgrammaticName)] '$($e.Current.Name)'"
              }
            } else {
              Write-Host '  overflow window still not present'
            }
          } else {
            Write-Host 'no tray chevron found'
          }

          Write-Host '--- where it keeps state ---'
          foreach ($d in "$env:APPDATA\Certum", "$env:LOCALAPPDATA\Certum", 'C:\ProgramData\Certum') {
            Get-ChildItem $d -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "  $($_.FullName) ($($_.Length) bytes)"
              if ($_.Length -lt 64KB) { Copy-Item $_.FullName loot -ErrorAction SilentlyContinue }
            }
          }

          Write-Host '--- application event log ---'
          Get-WinEvent -LogName Application -MaxEvents 15 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'Certum|SimplySign|\.NET' } |
            ForEach-Object { Write-Host "  $($_.LevelDisplayName): $($_.Message -replace "`r?`n", ' ' -replace '(.{200}).*', '$1...')" }

          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object Thumbprint -eq $env:THUMBPRINT
          if ($cert) {
            Write-Host "::notice::logged in -- $($cert.Subject)"
          } else {
            Write-Host '::warning::not logged in yet -- diagnostic run, see the dumps above'
          }

      - name: Sign something, to prove the key is usable
        if: ${{ inputs.sign_probe }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse `
                        -Filter signtool.exe | Where-Object FullName -like '*\x64\*' |
                        Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'no signtool.exe in the Windows SDK' }

          $probe = "$PWD\probe.exe"
          Copy-Item 'C:\Windows\System32\where.exe' $probe
          & $signtool.FullName sign /sha1 $env:THUMBPRINT /fd sha256 `
            /tr http://time.certum.pl /td sha256 /v $probe
          if ($LASTEXITCODE -ne 0) { throw "signtool exited $LASTEXITCODE" }

          $sig = Get-AuthenticodeSignature $probe
          Write-Host "  status:    $($sig.Status)"
          Write-Host "  signer:    $($sig.SignerCertificate.Subject)"
          Write-Host "  timestamp: $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "probe is $($sig.Status), not Valid" }
          if (-not $sig.TimeStamperCertificate) { throw 'no RFC 3161 countersignature' }
          Write-Host '::notice::the official stack signs end to end on a hosted runner'

      # SendKeys fails blind, so capture what the screen actually showed.
      - name: Screenshot and logs
        if: always()
        shell: pwsh
        run: |
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\screen.png")
            Write-Host "captured $($b.Width)x$($b.Height)"
          } catch {
            Write-Host "::warning::no screenshot: $_"
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: spike-diagnostics
          path: |
            screen.png
            msi-install.log
            loot/
          if-no-files-found: warn
