# Documentation screenshots: drive the GUI on a runner and capture every screen.
# Manual, and deliberately not part of the build gate -- run it after adding or
# changing an option page, and the artifact is the new set of shots.
name: screenshots

on:
  # A push trigger as well as the button: workflow_dispatch is only offered for
  # workflows that already exist on the default branch.
  push:
    paths:
      - '.github/workflows/screenshots.yml'
      - 'tools/screenshot-*.py'
      - 'tools/wincapture.py'
  workflow_dispatch:
    inputs:
      mode:
        description: 'walk (every screen) or probe (can this machine render at all)'
        type: choice
        options: [walk, probe]
        default: walk
      run-id:
        description: 'windows-build run to take the binaries from (default: the build of this commit)'
        required: false
      language:
        description: 'lang/ basename to run the GUI in, e.g. Francais.'
        required: false
        default: English
      artifact:
        description: 'artifact to run: the build output, or httrack-signed-binaries to shoot a signed app'
        required: false
        default: WinHTTrack-x64-Release

permissions:
  contents: read
  # Downloading another workflow run's artifact goes through the Actions API.
  actions: read

jobs:
  # The walk reads control IDs out of the checked-out resource.h, so it must drive the build
  # of this commit. windows-build starts on the same event; wait for it on a cheap runner.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      run-id: ${{ steps.pick.outputs.run-id }}
    steps:
      - name: Find the build of this commit
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run-id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${RUN_ID}" ]; then
            sha=$(gh run view "${RUN_ID}" --json headSha -q .headSha)
            echo "binaries from run ${RUN_ID} (given), built from ${sha}"
            [ "${sha}" = "${SHA}" ] ||
              echo "::warning::run ${RUN_ID} was built from ${sha}, not this checkout's ${SHA}"
            echo "run-id=${RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Match the commit, not the ref: a moved tag keeps the old build attached to the ref,
          # and a pull_request build of this head is not on the branch name at all.
          seen=0
          for i in $(seq 1 80); do
            rows=$(gh run list --workflow windows-build.yml --limit 40 \
                     --json databaseId,headSha,status,conclusion \
                     --jq ".[] | select(.headSha == \"${SHA}\") | [.databaseId, .status, .conclusion] | @tsv") ||
              { sleep 30; continue; }   # a rate limit or a 502 must not discard the wait
            id=$(printf '%s\n' "${rows}" | awk -F'\t' '$2 == "completed" && $3 == "success" { print $1; exit }')
            if [ -n "${id}" ]; then
              echo "binaries from run ${id}, the build of ${SHA}"
              echo "run-id=${id}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "${rows}" ]; then
              seen=1
              if [ "$(printf '%s\n' "${rows}" | awk -F'\t' '$2 != "completed"' | wc -l)" -eq 0 ]; then
                echo "::error::no green windows-build of ${SHA}: it failed, or a newer push superseded it"
                exit 1
              fi
            elif [ "${seen}" -eq 0 ] && [ "${i}" -ge 10 ]; then
              # Both workflows fire on the same event, so one that is coming is listed by now.
              echo "::error::no windows-build of ${SHA}: open its pull request first, or dispatch with run-id"
              exit 1
            fi
            sleep 30
          done
          echo "::error::the windows-build of ${SHA} was still running after 40 minutes"
          exit 1

  capture:
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 20
    # Shares the Windows runners with the build; queue: max, as the default cancels a waiter.
    concurrency:
      group: screenshots-capture
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The staged build artifact runs as-is (lang.def, lang/, html/, the engine DLLs
      # and the app-local CRT), so this needs no build and no installer. The sign job's
      # httrack-signed-binaries is the same tree signed, which is the only way to shoot
      # an About box that names the publisher.
      - name: Fetch the built app
        id: app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.resolve.outputs.run-id }}
          ARTIFACT: ${{ inputs.artifact || 'WinHTTrack-x64-Release' }}
        run: |
          # gh reads an empty id as "any run in the repo", so never let one through.
          if (-not $env:RUN_ID) { throw 'resolve named no build to walk' }
          gh run download $env:RUN_ID --name $env:ARTIFACT --dir app
          # The build artifact is one arch, flat; the signed one keeps a directory per
          # arch, and a wrong-arch shot is pixel-identical to a right one.
          $found = @(Get-ChildItem app -Recurse -Filter WinHTTrack.exe)
          if (-not $found) { throw "artifact $env:ARTIFACT has no WinHTTrack.exe" }
          # The directory name, not the full path: a workspace holding "x64" matches every arch.
          $exe = if ($found.Count -eq 1) { $found[0] }
                 else { $found | Where-Object { $_.Directory.Name -like '*x64*' } | Select-Object -First 1 }
          # An arch pair without x64 stops here rather than shooting an arbitrary one.
          if (-not $exe) { throw "artifact $env:ARTIFACT holds $($found.Count) WinHTTrack.exe, none in an x64 directory" }
          # The artifact ships WinHTTrack.ini, which would put the shots in portable mode:
          # a settings path and a default mirror folder no installed user ever sees.
          Remove-Item (Join-Path $exe.Directory.FullName 'WinHTTrack.ini') -ErrorAction SilentlyContinue
          Write-Host "walking $($exe.FullName)"
          "exe=$($exe.FullName)" | Out-File -Append $env:GITHUB_OUTPUT

      # The address shows in the wizard panes and in the mirror folder name, so the crawl
      # uses a real host. example.com is reserved for documentation (RFC 2606). The port
      # stays: http.sys holds 80 for WinRM, and the runner excludes it from binding.
      - name: Let the crawl address a named site
        shell: pwsh
        run: Add-Content "$env:SystemRoot\System32\drivers\etc\hosts" "`n127.0.0.1 www.example.com"

      - name: Capture
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
          LANGUAGE: ${{ inputs.language }}
          EXE: ${{ steps.app.outputs.exe }}
        run: |
          python -m pip install --quiet pywin32 pillow pywinauto
          $script = 'screenshot-walk.py'
          $site = @('--site-host', 'www.example.com')
          $lang = @()
          if ($env:LANGUAGE) { $lang = @('--language', $env:LANGUAGE) }
          # The probe only answers whether the machine renders at all, and takes no site.
          if ($env:MODE -eq 'probe') { $script = 'screenshot-probe.py'; $site = @(); $lang = @() }
          Write-Host "running $script"
          python "tools\$script" --exe $env:EXE --out shots @site @lang

      - name: Upload the screens
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: shots
          if-no-files-found: error
