# Documentation screenshots: drive the GUI on a runner and capture every screen.
# Manual, and deliberately not part of the build gate -- run it after adding or
# changing an option page, and the artifact is the new set of shots.
name: screenshots

on:
  # A push trigger as well as the button: workflow_dispatch is only offered for
  # workflows that already exist on the default branch.
  push:
    paths:
      - '.github/workflows/screenshots.yml'
      - 'tools/screenshot-*.py'
      - 'tools/wincapture.py'
  workflow_dispatch:
    inputs:
      mode:
        description: 'walk (every screen) or probe (can this machine render at all)'
        type: choice
        options: [walk, probe]
        default: walk
      run-id:
        description: 'windows-build run to take the binaries from (default: this branch, else master)'
        required: false

permissions:
  contents: read
  # Downloading another workflow run's artifact goes through the Actions API.
  actions: read

jobs:
  capture:
    runs-on: windows-2022
    timeout-minutes: 20
    # Shares the Windows runners with the build; queue: max, as the default cancels a waiter.
    concurrency:
      group: screenshots-capture
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The staged build artifact runs as-is (lang.def, lang/, html/, the engine DLLs
      # and the app-local CRT), so this needs no build and no installer.
      - name: Fetch the built app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run-id }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          function Get-Builds($ref) {
            gh run list --workflow windows-build.yml --branch $ref --status success `
              --limit 20 --json databaseId,headSha | ConvertFrom-Json
          }
          $id = $env:RUN_ID
          if ($id) {
            $sha = gh run view $id --json headSha -q '.headSha'
            Write-Host "binaries from run $id (given), built from $sha"
            if ($sha -ne $env:SHA) { Write-Host "::warning::run $id was built from $sha, not this checkout's $($env:SHA)" }
          } else {
            # A moved tag keeps the old build attached to the ref, so match the commit, not the ref name.
            foreach ($ref in @($env:BRANCH, 'master') | Select-Object -Unique) {
              $run = Get-Builds $ref | Where-Object { $_.headSha -eq $env:SHA } | Select-Object -First 1
              # "of", not "from": a pull_request build is of the merge commit for this head.
              if ($run) { $id = $run.databaseId; Write-Host "binaries from run $id ($ref), the build of $($env:SHA)"; break }
            }
            if (-not $id) {
              $run = Get-Builds 'master' | Select-Object -First 1
              if (-not $run) { throw "no green windows-build run to take binaries from" }
              $id = $run.databaseId
              # The walk reads control IDs out of the checked-out resource.h, so another tree's binaries can disagree with it.
              Write-Host "binaries from run $id (master), built from $($run.headSha)"
              Write-Host "::warning::no build of $($env:SHA): these are master's binaries from $($run.headSha), which may not match this checkout"
            }
          }
          gh run download $id --name WinHTTrack-x64-Release --dir app
          if (-not (Test-Path app\WinHTTrack.exe)) { throw 'artifact has no WinHTTrack.exe' }

      # The address shows in the wizard panes and in the mirror folder name, so the crawl
      # uses a real host. example.com is reserved for documentation (RFC 2606). The port
      # stays: http.sys holds 80 for WinRM, and the runner excludes it from binding.
      - name: Let the crawl address a named site
        shell: pwsh
        run: Add-Content "$env:SystemRoot\System32\drivers\etc\hosts" "`n127.0.0.1 www.example.com"

      - name: Capture
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python -m pip install --quiet pywin32 pillow pywinauto
          $script = 'screenshot-walk.py'
          $site = @('--site-host', 'www.example.com')
          # The probe only answers whether the machine renders at all, and takes no site.
          if ($env:MODE -eq 'probe') { $script = 'screenshot-probe.py'; $site = @() }
          Write-Host "running $script"
          python "tools\$script" --exe app\WinHTTrack.exe --out shots @site

      - name: Upload the screens
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: shots
          if-no-files-found: error
